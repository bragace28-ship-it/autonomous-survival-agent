t-size:11px;letter-spacing:.08em;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn.ok{background:var(--okbg);color:var(--ok)}.btn.warn{background:var(--warnbg);color:var(--warn)}.btn.danger{background:var(--dangerbg);color:var(--danger)}.btn.outline{background:#fff;border:1px solid var(--line)}.summary{background:var(--surface2);border-radius:14px;padding:14px}.summary-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0}.summary-row.total{font-size:16px;border-top:1px solid var(--line);margin-top:4px;padding-top:10px}.table-scroll{overflow:auto}.table-scroll table{width:100%;border-collapse:collapse;min-width:700px}.table-scroll th,.table-scroll td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left}.table-scroll th{font-size:11px;text-transform:uppercase;color:var(--muted)}.badge{display:inline-block;border-radius:999px;padding:5px 9px;background:#eeeae4;font-size:12px}.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.danger{background:var(--dangerbg);color:var(--danger)}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:700;color:#5c5750;margin:0 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit}.filters{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:9px;margin-bottom:14px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick .btn{display:flex;flex-direction:column;align-items:flex-start;text-align:left}.mini-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.mini-kpi{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:15px}.mini-kpi small{color:var(--muted)}.mini-kpi b{display:block;font-size:20px;margin-top:5px}.account-list{display:grid;gap:8px}.account-row{display:grid;grid-template-columns:1.5fr 1fr auto auto auto;gap:12px;padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff}.account-row small{display:block}.account-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}.amount{font-weight:800;white-space:nowrap}.account-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.account-tabs .active{background:var(--dark);color:#fff}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.client-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.client-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 6px 20px #231e1908}.client-card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.client-main{display:flex;gap:12px}.client-avatar{width:46px;height:46px;border-radius:14px;background:var(--dark);color:#fff;display:grid;place-items:center;font-weight:800}.client-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}.order-line{display:grid;grid-template-columns:1.6fr 1fr .8fr .8fr auto;gap:8px;align-items:end;border:1px solid var(--line);padding:10px;border-radius:12px;margin-bottom:8px}.command-services{display:grid;gap:8px}.command-service{display:flex;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.summary-box{background:var(--surface2);border-radius:16px;padding:16px}.pay-method-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.pay-method{border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px;cursor:pointer;text-align:center;font:inherit}.pay-method.selected{outline:2px solid var(--dark);background:var(--surface2)}.attachment-box{border:1px dashed var(--line);border-radius:14px;padding:14px;background:var(--surface2)}.attachment-box input{margin-top:8px}.credit-link{background:var(--warnbg);border:1px solid #e5d7b8;border-radius:13px;padding:12px}.modal-back{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal-back.show{display:flex}.modal{background:#fff;border-radius:20px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.modal-head h2{margin:0}.toast{position:fixed;right:16px;bottom:24px;background:var(--dark);color:#fff;padding:12px 15px;border-radius:12px;display:none;z-index:30}.toast.show{display:block}.bottom{display:none}@media(max-width:800px){.grid4,.mini-kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}.quick{grid-template-columns:1fr 1fr}.account-row{grid-template-columns:1fr 1fr}.account-actions{grid-column:1/-1;justify-content:flex-start}.filters{grid-template-columns:1fr 1fr}.client-cards{grid-template-columns:1fr}.order-line{grid-template-columns:1fr 1fr}.pay-method-grid{grid-template-columns:1fr 1fr}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;height:64px;background:#fff;border-top:1px solid var(--line);z-index:10}.bottom button{flex:1;border:0;background:#fff;font:11px system-ui}.bottom span{display:block;font-size:18px}.content{padding:18px 13px 85px}}@media(max-width:460px){.grid4,.grid3,.mini-kpis,.quick,.filters,.two,.pay-method-grid{grid-template-columns:1fr}.brand small{display:none}.role-switch button{padding:8px 9px}.account-row{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-direction:column}.order-line{grid-template-columns:1fr}.client-card{padding:15px}}

<body>
<header class="appbar"><div class="brand"><div class="brandm">E</div><div><b>ED & DU</b><small>Terapia da Beleza</small></div></div><div class="role-switch"><button id="proBtn" class="active" onclick="setRole('pro')">Profissional</button><button id="cliBtn" onclick="setRole('cli')">Cliente</button></div></header>
<div id="root"></div><div id="toast" class="toast"></div><div id="modal" class="modal-back"></div>
<script>
const SERVICES=[{id:1,n:'Corte Feminino',base:110,long:140,cost:49,time:60,icon:'✂️'},{id:2,n:'Corte Masculino',base:89,long:89,cost:31,time:45,icon:'✂️'},{id:3,n:'Corte + Secagem',base:136,long:166,cost:56,time:60,icon:'💨'},{id:4,n:'Escova Efeito Liso',base:99,long:130,cost:46,time:60,icon:'✨'},{id:5,n:'Escova com Text.',base:112,long:140,cost:53,time:60,icon:'✨'},{id:6,n:'Lava e seca',base:89,long:99,cost:29,time:45,icon:'🫧'},{id:7,n:'Bio Nutrição',base:89,long:99,cost:41,time:60,icon:'🌿'},{id:8,n:'Bio Reconstrução',base:149,long:179,cost:50,time:75,icon:'🧴'},{id:9,n:'Coloração Avulso',base:189,long:289,cost:110,time:120,icon:'🎨'},{id:10,n:'Selagem 3D',base:229,long:329,cost:180,time:120,icon:'✨'},{id:11,n:'Escova progressiva',base:289,long:389,cost:180,time:150,icon:'✨'},{id:12,n:'Alisamento',base:259,long:359,cost:180,time:150,icon:'💫'},{id:13,n:'Combo Mechas Dia',base:729,long:849,cost:315,time:240,icon:'🎨'},{id:14,n:'Combo Master',base:1599,long:1999,cost:802,time:300,icon:'👑'},{id:15,n:'Combo Coloração',base:249,long:349,cost:170,time:180,icon:'🎨'},{id:16,n:'Combo Terapia',base:599,long:799,cost:197,time:180,icon:'🧴'}];
const PROS=['Ana','Eduardo','Marina'];
const demo={clients:[{id:1,name:'Mariana Silva',phone:'(11) 99999-1111',email:'mariana@email.com',points:340,term:true,anam:'Sensibilidade no couro cabeludo.',history:['12/09/2026 • Corte Feminino • Ana • R$ 110'],anams:[]},{id:2,name:'João Pedro',phone:'(11) 98888-2222',email:'joao@email.com',points:180,term:false,anam:'Sem restrições registradas.',history:['10/09/2026 • Coloração Avulso • Marina • R$ 189'],anams:[]}],requests:[{id:1,clientId:1,client:'Mariana Silva',serviceId:3,service:'Corte + Secagem',prof:'Ana',date:'2026-09-18',time:'14:00',status:'Pendente'},{id:2,clientId:2,client:'João Pedro',serviceId:9,service:'Coloração Avulso',prof:'Marina',date:'2026-09-18',time:'16:00',status:'Aprovado'}],orders:[{id:100,clientId:2,client:'João Pedro',prof:'Marina',items:[{serviceId:9,length:'base'}],discount:0,discountReason:'',open:false,payment:'paid',paidAt:'10/09/2026 18:20'}],fixedCosts:21300,revenue:48750,att:281,payables:[{id:9101,supplier:'Distribuidora Beauty',description:'Produtos profissionais',value:1850,dueDate:'2026-09-15',method:'Pix',category:'Produtos',status:'pending',note:'Reposição mensal'},{id:9102,supplier:'Imobiliária Central',description:'Aluguel do salão',value:6500,dueDate:'2026-09-20',method:'Transferência',category:'Aluguel',status:'pending',note:''},{id:9103,supplier:'Contabilidade',description:'Honorários contábeis',value:480,dueDate:'2026-10-05',method:'Pix',category:'Serviços',status:'pending',note:''}],receivables:[{id:9201,client:'Mariana Silva',description:'Comanda #1001',value:420,dueDate:'2026-09-18',method:'Pix',category:'Serviços',status:'pending',note:''},{id:9202,client:'João Pedro',description:'Parcela 1/2 — Combo',value:799.5,dueDate:'2026-09-25',method:'Boleto',category:'Serviços',status:'pending',note:''},{id:9203,client:'Cliente corporativo',description:'Pacote outubro',value:1200,dueDate:'2026-10-10',method:'Transferência',category:'Serviços',status:'pending',note:''}],cardInvoices:[]};
let db;try{const raw=localStorage.getItem('eddu_v12');db=raw?JSON.parse(raw):null;if(!db||!Array.isArray(db.clients)||!Array.isArray(db.orders))db=JSON.parse(JSON.stringify(demo))}catch(e){db=JSON.parse(JSON.stringify(demo))}db.payables=Array.isArray(db.payables)?db.payables:[];db.receivables=Array.isArray(db.receivables)?db.receivables:[];db.cardInvoices=Array.isArray(db.cardInvoices)?db.cardInvoices:[];let app={role:'pro',page:'dashboard',clientPage:'home'};
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const svc=id=>SERVICES.find(x=>x.id==id);const currentMonth=()=>new Date().toISOString().slice(0,7);const nextMonth=()=>{let d=new Date();d.setMonth(d.getMonth()+1);return d.toISOString().slice(0,7)};const monthKey=d=>String(d||'').slice(0,7);const monthLabel=k=>{let[y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})};
function save(){localStorage.setItem('eddu_v12',JSON.stringify(db))}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove('show'),2600)}function setRole(r){app.role=r;app.page=r==='pro'?'dashboard':'home';document.getElementById('proBtn').classList.toggle('active',r==='pro');document.getElementById('cliBtn').classList.toggle('active',r==='cli');render()}function go(p){app.page=p;render()}function cgo(p){app.clientPage=p;render()}function orderCalc(o){let sub=0,cost=0;(o.items||[]).forEach(i=>{let s=svc(i.serviceId);if(s){sub+=i.length==='long'?s.long:s.base;cost+=s.cost}});let discount=Math.max(0,Math.min(Number(o.discount)||0,sub));let net=sub-discount,commission=net*.3,profit=net-cost-commission;return{sub,discount,net,cost,commission,profit}}
function navPro(){return `<nav class=nav><button class="${app.page==='dashboard'?'active':''}" onclick="go('dashboard')">Dashboard</button><button class="${app.page==='requests'?'active':''}" onclick="go('requests')">Solicitações</button><button class="${app.page==='agenda'?'active':''}" onclick="go('agenda')">Agenda</button><button class="${app.page==='clients'?'active':''}" onclick="go('clients')">Clientes</button><button class="${app.page==='orders'?'active':''}" onclick="go('orders')">Comandas</button><button class="${app.page==='finance'?'active':''}" onclick="go('finance')">Gestão de Contas</button></nav>`}
function dashboard(){let paid=db.orders.filter(o=>o.payment==='paid'),rev=paid.reduce((a,o)=>a+orderCalc(o).net,0)+45000,costs=db.fixedCosts,profit=rev-costs;return `<div class=content>${navPro()}<div class=page-head><div><h1>Dashboard</h1><p>Visão geral do desempenho do salão.</p></div><span class="badge ok">● Sistema operacional</span></div><div class=grid4><div class="card metric"><small>Faturamento mensal</small><strong>${money(rev)}</strong><span class=muted>Entradas confirmadas</span></div><div class="card metric"><small>Custos</small><strong>${money(costs)}</strong><span class=muted>Fixos + variáveis</span></div><div class="card metric"><small>Lucro líquido</small><strong>${money(profit)}</strong><span>${(profit/rev*100).toFixed(1)}% margem</span></div><div class="card metric"><small>Ticket médio</small><strong>${money(rev/Math.max(1,db.att))}</strong><span class=muted>Por atendimento</span></div></div><br><div class=grid2><div class="card"><h2>Desempenho</h2><div class=summary><div class=summary-row><span>Faturamento</span><b>${money(rev)}</b></div><div class=summary-row><span>Custos</span><b>${money(costs)}</b></div><div class="summary-row total"><span>Resultado</span><b>${money(profit)}</b></div></div></div><div class=card><h2>Atalhos</h2><div class=quick><button class=btn onclick="go('requests')"><b>Solicitações</b><span>Pedidos pendentes</span></button><button class=btn onclick="go('agenda')"><b>Agenda</b><span>Atendimentos</span></button><button class=btn onclick="go('clients')"><b>Clientes</b><span>Cadastros e fichas</span></button><button class=btn onclick="go('orders')"><b>Comandas</b><span>Atendimentos e pagamentos</span></button></div></div></div></div>`}
function requests(){return `<div class=content>${navPro()}<div class=page-head><div><h1>Solicitações</h1><p>Aprove, altere o serviço, reagende ou inicie o atendimento.</p></div></div><div class=card><div class=table-scroll><table><thead><tr><th>Cliente</th><th>Serviço</th><th>Profissional</th><th>Data / Hora</th><th>Status</th><th>Ações</th></tr></thead><tbody>${db.requests.map(r=>`<tr><td><b>${esc(r.client)}</b></td><td>${esc(r.service)}</td><td>${esc(r.prof)}</td><td>${r.date.split('-').reverse().join('/')}<br>${r.time}</td><td><span class="badge ${r.status==='Aprovado'?'ok':'warn'}">${esc(r.status)}</span></td><td><div class=actions><button class="btn ok" onclick="approveReq(${r.id})">Aprovar</button><button class=btn onclick="changeReq(${r.id})">Alterar serviço</button><button class=btn onclick="reschedReq(${r.id})">Reagendar</button><button class="btn primary" onclick="startReq(${r.id})">Iniciar atendimento</button></div></td></tr>`).join('')}</tbody></table></div></div></div>`}
function approveReq(id){let r=db.requests.find(x=>x.id===id);if(r){r.status='Aprovado';save();toast('Agendamento aprovado.');render()}}function changeReq(id){let r=db.requests.find(x=>x.id===id);showModal('Alterar serviço',`<div class=field><label>Serviço</label><select id=ms>${SERVICES.map(s=>`<option value="${s.id}" ${s.id===r.serviceId?'selected':''}>${s.n}</option>`).join('')}</select></div><div class=field><label>Comprimento</label><select id=ml><option value=base>Base</option><option value=long>Longo</option></select></div><div class=actions><button class=btn onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="let s=svc(Number(ms.value));r.serviceId=s.id;r.service=s.n;r.length=ml.value;save();closeModal();toast('Serviço alterado.');render()">Salvar alteração</button></div>`)}function reschedReq(id){let r=db.requests.find(x=>x.id===id);showModal('Reagendar atendimento',`<div class=field><label>Nova data</label><input id=mdate type=date value="${r.date}"></div><div class=field><label>Novo horário</label><select id=mtime>${['09:00','10:30','14:00','16:00','16:30','18:00'].map(t=>`<option ${t===r.time?'selected':''}>${t}</option>`).join('')}</select></div><div class=actions><button class=btn onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="r.date=mdate.value;r.time=mtime.value;r.status='Nova data sugerida';save();closeModal();toast('Nova data enviada.');render()">Salvar</button></div>`)}function startReq(id){let r=db.requests.find(x=>x.id===id);let o={id:Date.now(),clientId:r.clientId,client:r.client,prof:r.prof,items:[],discount:0,discountReason:'',open:true,payment:'draft',request:id};db.orders.unshift(o);save();go('orders');setTimeout(()=>openOrder(o.id),0)}
function agenda(){let list=db.requests.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return `<div class=content>${navPro()}<div class=page-head><div><h1>Agenda</h1><p>Atendimentos, alterações e comandas.</p></div></div><div class=card>${list.map(r=>`<div class=card style="margin-bottom:10px;background:#fbfaf8"><div class=page-head><div><h3 style="margin:0">${esc(r.date.split('-').reverse().join('/'))} • ${esc(r.time)}</h3><p>${esc(r.client)} • ${esc(r.service)} • ${esc(r.prof)}</p></div><span class="badge ${r.status==='Aprovado'?'ok':'warn'}">${esc(r.status)}</span></div><div class=actions><button class="btn primary" onclick="openAppointmentCommand(${r.id})">Abrir comanda</button><button class=btn onclick="reschedReq(${r.id})">Editar</button><button class=btn onclick="closeAppointmentCommand(${r.id})">Fechar comanda</button></div></div>`).join('')||'<div class=empty>Nenhum atendimento.</div>'}</div></div>`}
function openAppointmentCommand(id){let r=db.requests.find(x=>x.id===id),o=db.orders.find(x=>x.request===id);if(!o){o={id:Date.now(),clientId:r.clientId,client:r.client,prof:r.prof,items:[{serviceId:r.serviceId,length:r.length||'base'}],discount:0,discountReason:'',open:true,payment:'draft',request:id};db.orders.unshift(o);save()}openOrder(o.id)}function closeAppointmentCommand(id){let r=db.requests.find(x=>x.id===id),o=db.orders.find(x=>x.request===id);if(o)closeOrder(o.id);else openAppointmentCommand(id)}
function clients(){return `<div class=content>${navPro()}<div class=page-head><div><h1>Clientes</h1><p>Cadastro, relacionamento, ficha, anamnese e documentos.</p></div><button class="btn primary" onclick="newClient()">+ Novo cliente</button></div><div class=filters><input placeholder="Buscar cliente..." oninput="filterClientCards(this.value)"><select onchange="filterClientCards('',this.value)"><option value=all>Todos</option><option value=signed>Termo assinado</option><option value=pending>Termo pendente</option></select></div><div id=clientCards class=client-cards>${clientCardList(db.clients)}</div></div>`}function clientCardList(list){return list.map(c=>{let initials=c.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();return `<article class=client-card data-client-search="${esc((c.name+' '+c.phone+' '+c.email).toLowerCase())}" data-term="${c.term?'signed':'pending'}"><div class=client-card-head><div class=client-main><div class=client-avatar>${initials}</div><div><h3 style="margin:0">${esc(c.name)}</h3><p class=muted style="margin:3px 0">${esc(c.phone)}</p><small class=muted>${esc(c.email||'Sem e-mail')}</small></div></div><span class="badge ${c.term?'ok':'warn'}">${c.term?'Termo ok':'Termo pendente'}</span></div><div class=summary style="margin-top:14px"><div class=summary-row><span>Fidelidade</span><b>${c.points||0} pts</b></div><div class=summary-row><span>Procedimentos</span><b>${(c.history||[]).length}</b></div></div><div class=client-actions><button class=btn onclick="editClient(${c.id})">Editar</button><button class=btn onclick="wa('${esc(c.phone)}','Olá ${esc(c.name)}, aqui é da ED & DU | Terapia da Beleza.')">WhatsApp</button><button class="btn primary" onclick="openClientFile(${c.id})">Abrir ficha</button></div></article>`}).join('')||'<div class=empty>Nenhum cliente encontrado.</div>'}function filterClientCards(q='',term='all'){q=(q||'').toLowerCase();document.querySelectorAll('#clientCards .client-card').forEach(el=>{el.style.display=(!q||el.dataset.clientSearch.includes(q))&&(term==='all'||el.dataset.term===term)?'block':'none'})}
function newClient(){showModal('Novo cliente',`<div class=two><div class=field><label>Nome completo</label><input id=cn></div><div class=field><label>Telefone / WhatsApp</label><input id=cp></div></div><div class=field><label>E-mail</label><input id=ce type=email></div><div class=actions><button class=btn onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="createClient()">Cadastrar</button></div>`)}function editClient(id){let c=db.clients.find(x=>x.id===id);showModal('Editar dados cadastrais',`<div class=two><div class=field><label>Nome</label><input id=cn value="${esc(c.name)}"></div><div class=field><label>Telefone</label><input id=cp value="${esc(c.phone)}"></div></div><div class=field><label>E-mail</label><input id=ce value="${esc(c.email)}"></div><div class=actions><button class=btn onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="c.name=cn.value.trim()||c.name;c.phone=cp.value.trim()||c.phone;c.email=ce.value.trim();save();closeModal();toast('Cadastro atualizado.');render()">Salvar alterações</button></div>`)}function createClient(){if(!cn.value.trim()||!cp.value.trim()){toast('Nome e telefone são obrigatórios.');return}db.clients.push({id:Date.now(),name:cn.value.trim(),phone:cp.value.trim(),email:ce.value.trim(),points:0,term:false,anam:'',history:[],anams:[]});save();closeModal();toast('Cliente cadastrado.');render()}
function openClientFile(id){let c=db.clients.find(x=>x.id===id);showModal('Ficha do Cliente',`<div class=actions><button class=btn onclick="editClient(${id})">Editar cadastro</button><button class=btn onclick="wa('${esc(c.phone)}','Olá ${esc(c.name)}, tudo bem? Aqui é da ED & DU | Terapia da Beleza.')">WhatsApp</button><button class="btn primary" onclick="sendTerm(${id})">Enviar Termo</button></div><br><div class=grid2><div class=card><h3>Dados</h3><p><b>${esc(c.name)}</b><br>${esc(c.phone)}<br>${esc(c.email)}</p><span class="badge ok">${c.points} pontos</span></div><div class=card><h3>Termo</h3><span class="badge ${c.term?'ok':'warn'}">${c.term?'Assinado':'Pendente'}</span></div></div><br><div class=card><h3>Anamnese</h3><div class=two><div class=field><label>Data</label><input id=ad type=date value="${new Date().toISOString().slice(0,10)}"></div><div class=field><label>Hora</label><input id=at type=time value="${new Date().toTimeString().slice(0,5)}"></div></div><div class=field><label>Descrição do procedimento</label><textarea id=ax rows=4></textarea></div><div class=field><label>Fotos</label><input id=af type=file accept="image/*" capture="environment" multiple></div><button class="btn primary" onclick="saveAnam(${id})">Salvar anamnese</button>${(c.anams||[]).map(a=>`<div class=summary style="margin-top:8px"><b>${a.date} às ${a.time}</b><p>${esc(a.desc)}</p><span class=muted>${a.photos} foto(s)</span></div>`).join('')}</div>`)}function saveAnam(id){let c=db.clients.find(x=>x.id===id);if(!ad.value||!at.value||!ax.value.trim()){toast('Preencha data, hora e descrição.');return}c.anams=c.anams||[];c.anams.unshift({date:ad.value,time:at.value,desc:ax.value.trim(),photos:af.files.length});c.history.unshift(ad.value.split('-').reverse().join('/')+' • '+ax.value.trim());save();openClientFile(id);toast('Anamnese salva.')}function sendTerm(id){let c=db.clients.find(x=>x.id===id);toast('Termo preparado para '+c.name+'.')}
function wa(phone,msg){let n=String(phone).replace(/\D/g,'');if(n.length<10){toast('Telefone inválido.');return}if(!n.startsWith('55'))n='55'+n;window.open('https://wa.me/'+n+'?text='+encodeURIComponent(msg),'_blank')}
function orders(){let open=db.orders.filter(o=>o.open),pay=db.orders.filter(o=>!o.open&&o.payment==='pending'),paid=db.orders.filter(o=>!o.open&&o.payment==='paid');return `<div class=content>${navPro()}<div class=page-head><div><h1>Comandas</h1><p>Controle de serviços, produtos, desconto, custo, comissão, lucro e pagamento.</p></div><button class="btn primary" onclick="newOrder()">+ Abrir comanda</button></div><div class=grid3><div class=card><div class=eyebrow>EM ABERTO</div><strong style="font-size:28px">${open.length}</strong></div><div class=card><div class=eyebrow>AGUARDANDO PAGAMENTO</div><strong style="font-size:28px">${pay.length}</strong></div><div class=card><div class=eyebrow>PAGAS</div><strong style="font-size:28px">${paid.length}</strong></div></div><br>${orderSection('COMANDAS ABERTAS',open,'open')}${orderSection('AGUARDANDO PAGAMENTO',pay,'pay')}${orderSection('PAGAS',paid,'paid')}</div>`}
function orderSection(title,list,type){return `<div class=card style="margin-bottom:16px"><div class=head style="margin-bottom:10px"><div><h2>${title}</h2><span class=muted>${type==='open'?'Atendimentos em andamento.':type==='pay'?'Selecione e confirme a forma de pagamento.':'Histórico de comandas concluídas.'}</span></div></div>${list.length?list.map(o=>orderCard(o)).join(''):'<p class=muted>Nenhuma comanda nesta etapa.</p>'}</div>`}
function orderCard(o){let x=orderCalc(o);return `<div class=card style="margin:10px 0;background:#fbfaf8"><div class=page-head style="margin-bottom:8px"><div><h3>${esc(o.client)} <span class="badge ${o.open?'warn':o.payment==='paid'?'ok':'warn'}">${o.open?'EM ABERTO':o.payment==='paid'?'PAGO':'AGUARDANDO PAGAMENTO'}</span></h3><span class=muted>Profissional: ${esc(o.prof)}</span></div><strong>${money(x.net)}</strong></div><div class=grid4><div><small class=muted>Subtotal</small><br><b>${money(x.sub)}</b></div><div><small class=muted>Desconto</small><br><b>${money(x.discount)}</b></div><div><small class=muted>Custo</small><br><b>${money(x.cost)}</b></div><div><small class=muted>Lucro</small><br><b>${money(x.profit)}</b></div></div><br><div class=actions><button class=btn onclick="viewOrder(${o.id})">Visualizar comanda</button><button class=btn onclick="openOrder(${o.id})">Editar comanda</button>${o.open?`<button class="btn primary" onclick="closeOrder(${o.id})">Fechar comanda</button>`:o.payment==='pending'?`<button class="btn warn" onclick="openPaymentModal(${o.id})">Receber pagamento</button>`:''}</div></div>`}
function newOrder(){let c=db.clients[0];let o={id:Date.now(),clientId:c.id,client:c.name,prof:PROS[0],items:[],discount:0,discountReason:'',open:true,payment:'draft'};db.orders.unshift(o);save();openOrder(o.id)}
function viewOrder(id){let o=db.orders.find(x=>x.id===id);if(!o)return;let x=orderCalc(o);showModal('Visualização da comanda',`<div class=eyebrow>RESUMO DO ATENDIMENTO</div><div class=summary-box><p><b>Cliente:</b> ${esc(o.client)}</p><p><b>Profissional:</b> ${esc(o.prof)}</p><div class=command-services>${(o.items||[]).map(it=>{let s=svc(it.serviceId);return `<div class=command-service><span>${esc(s.n)} <small class=muted>(${it.length==='long'?'Longo':'Base'})</small></span><b>${money(it.length==='long'?s.long:s.base)}</b></div>`}).join('')||'<p class=muted>Nenhum serviço lançado.</p>'}</div><hr><div class=summary-row><span>Subtotal</span><b>${money(x.sub)}</b></div><div class=summary-row><span>Desconto</span><b>- ${money(x.discount)}</b></div><div class="summary-row total"><span>Total cliente</span><b>${money(x.net)}</b></div><div class=summary-row><span>Custo total</span><b>${money(x.cost)}</b></div><div class=summary-row><span>Lucro estimado</span><b>${money(x.profit)}</b></div></div><br><div class=actions><button class="btn outline" onclick="closeModal()">Fechar janela</button>${o.open?`<button class=btn onclick="closeModal();openOrder(${o.id})">Editar comanda</button><button class="btn primary" onclick="closeOrder(${o.id})">Fechar comanda</button>`:o.payment==='pending'?`<button class="btn primary" onclick="openPaymentModal(${o.id})">Fechar comanda / receber</button>`:''}</div>`)}
function openOrder(id){let o=db.orders.find(x=>x.id===id);if(!o)return;showModal('Editar comanda • '+o.client,orderEditor(o,orderCalc(o)))}function orderEditor(o,x){return `<div class=two><div class=field><label>Cliente</label><select id=oc>${db.clients.map(c=>`<option value="${c.id}" ${c.id===o.clientId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class=field><label>Profissional</label><select id=op>${PROS.map(p=>`<option ${p===o.prof?'selected':''}>${p}</option>`).join('')}</select></div></div><div class=card><h3>Serviços realizados</h3><div id=orderLines>${(o.items||[]).map((it,i)=>lineEditor(it,i)).join('')}</div><button class=btn onclick="addOrderLine()">+ Adicionar serviço</button></div><br><div class=grid2><div class=card><h3>Desconto</h3><div class=field><label>Desconto (R$)</label><input id=od type=number min=0 step=.01 value="${o.discount||0}"></div><div class=field><label>Motivo</label><input id=odr value="${esc(o.discountReason||'')}"></div><button class=btn onclick="applyOrderChanges(${o.id})">Salvar alterações</button></div><div class=card><h3>Resumo financeiro</h3><div id=orderSummary class=summary>${orderSummaryHTML(x)}</div></div></div><br><div class=actions><button class="btn outline" onclick="closeModal()">Sair</button>${o.open?`<button class="btn primary" onclick="closeOrder(${o.id})">Fechar comanda</button>`:''}</div>`}function orderSummaryHTML(x){return `<div class=summary-row><span>Subtotal</span><b>${money(x.sub)}</b></div><div class=summary-row><span>Desconto</span><b>- ${money(x.discount)}</b></div><div class="summary-row total"><span>Total cliente</span><b>${money(x.net)}</b></div><div class=summary-row><span>Custo</span><b>${money(x.cost)}</b></div><div class=summary-row><span>Comissão 30%</span><b>${money(x.commission)}</b></div><div class="summary-row total"><span>Lucro</span><b>${money(x.profit)}</b></div>`}function lineEditor(it,i){let s=svc(it.serviceId)||SERVICES[0];return `<div class=order-line data-i="${i}"><div><label>Serviço</label><select class=li-service onchange="recalcOrderModal()">${SERVICES.map(s=>`<option value="${s.id}" ${s.id===it.serviceId?'selected':''}>${s.n}</option>`).join('')}</select></div><div><label>Comprimento</label><select class=li-length onchange="recalcOrderModal()"><option value=base ${it.length!=='long'?'selected':''}>Base</option><option value=long ${it.length==='long'?'selected':''}>Longo</option></select></div><div><label>Valor</label><input class=li-value value="${money(it.length==='long'?s.long:s.base)}" disabled></div><div><label>Custo</label><input class=li-cost value="${money(s.cost)}" disabled></div><button class="btn danger" onclick="this.closest('.order-line').remove();recalcOrderModal()">Remover</button></div>`}function addOrderLine(){let box=document.getElementById('orderLines');if(!box)return;let div=document.createElement('div');div.innerHTML=lineEditor({serviceId:1,length:'base'},Date.now());box.appendChild(div.firstElementChild);recalcOrderModal()}function recalcOrderModal(){let rows=[...document.querySelectorAll('#orderLines .order-line')],sub=0,cost=0;rows.forEach(r=>{let s=svc(Number(r.querySelector('.li-service').value)),l=r.querySelector('.li-length').value;sub+=l==='long'?s.long:s.base;cost+=s.cost;r.querySelector('.li-value').value=money(l==='long'?s.long:s.base);r.querySelector('.li-cost').value=money(s.cost)});let d=Math.max(0,Math.min(Number(document.getElementById('od')?.value)||0,sub)),net=sub-d,com=net*.3,profit=net-cost-com,box=document.getElementById('orderSummary');if(box)box.innerHTML=orderSummaryHTML({sub,discount:d,net,cost,commission:com,profit})}
function applyOrderChanges(id){let o=db.orders.find(x=>x.id===id);o.clientId=Number(document.getElementById('oc').value);o.client=db.clients.find(c=>c.id===o.clientId).name;o.prof=document.getElementById('op').value;o.discount=Number(document.getElementById('od').value)||0;o.discountReason=document.getElementById('odr').value.trim();o.items=[...document.querySelectorAll('#orderLines .order-line')].map(r=>({serviceId:Number(r.querySelector('.li-service').value),length:r.querySelector('.li-length').value}));save();toast('Comanda atualizada.');openOrder(id)}
function closeOrder(id){let o=db.orders.find(x=>x.id===id);if(!o)return;let x=orderCalc(o);if(!o.items.length){toast('Adicione pelo menos um serviço antes de fechar.');openOrder(id);return}o.open=false;o.payment='pending';o.closedAt=new Date().toLocaleString('pt-BR');save();closeModal();openPaymentModal(id)}function sendPayment(id){openPaymentModal(id)}function openPaymentModal(id){let o=db.orders.find(x=>x.id===id);if(!o)return;let x=orderCalc(o);showModal('Pagamento da comanda',`<div class=summary-box><div class="summary-row total"><span>Total a liquidar</span><b>${money(x.net)}</b></div></div><br><div class=field><label>Forma de pagamento</label><div class=pay-method-grid>${['Pix','Cartão de Crédito','Cartão de Débito','Dinheiro','Boleto'].map(m=>`<button type=button class="pay-method ${o.paymentMethod===m?'selected':''}" onclick="selectPaymentMethod(${id},'${m}')">${m}</button>`).join('')}</div></div><div id=payment-extra>${o.paymentMethod==='Cartão de Crédito'?'<div class=credit-link><b>Cartão de crédito</b><p class=muted>Recebimento associado à fatura do cartão.</p></div>':''}</div><br><div class=actions><button class="btn outline" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="confirmOrderPayment(${id})">Confirmar liquidação</button></div>`)}function selectPaymentMethod(id,m){let o=db.orders.find(x=>x.id===id);o.paymentMethod=m;document.querySelectorAll('.pay-method').forEach(b=>b.classList.toggle('selected',b.textContent===m));let e=document.getElementById('payment-extra');if(e)e.innerHTML=m==='Cartão de Crédito'?'<div class=credit-link><b>Cartão de crédito</b><p class=muted>Pagamento associado à fatura do cartão.</p></div>':''}function confirmOrderPayment(id){let o=db.orders.find(x=>x.id===id);if(!o||!o.paymentMethod){toast('Selecione a forma de pagamento.');return}o.payment='paid';o.paidAt=new Date().toLocaleString('pt-BR');o.paymentConfirmed=true;save();closeModal();toast('Pagamento confirmado.');render()}
function finance(){let tab=app.financeTab||'overview';return `<div class=content>${navPro()}<div class=page-head><div><h1>Gestão de Contas</h1><p>Contas a pagar, receber, vencimentos, anexos e conciliação.</p></div><div class=actions><button class=btn onclick="openAccount('payable')">+ Conta a pagar</button><button class="btn primary" onclick="openAccount('receivable')">+ Conta a receber</button><button class=btn onclick="exportCSV()">Exportar CSV</button></div></div><div class=account-tabs><button class="btn ${tab==='overview'?'active':''}" onclick="setFinanceTab('overview')">Visão geral</button><button class="btn ${tab==='payables'?'active':''}" onclick="setFinanceTab('payables')">Contas a pagar</button><button class="btn ${tab==='receivables'?'active':''}" onclick="setFinanceTab('receivables')">Contas a receber</button></div>${tab==='overview'?financeOverview():tab==='payables'?financeAccounts('payable'):financeAccounts('receivable')}</div>`}function setFinanceTab(t){app.financeTab=t;render()}function financeOverview(){let mk=currentMonth(),nm=nextMonth(),p=db.payables.filter(x=>x.status!=='paid'),r=db.receivables.filter(x=>x.status!=='received'),pm=p.filter(x=>monthKey(x.dueDate)===mk).reduce((a,x)=>a+Number(x.value||0),0),pn=p.filter(x=>monthKey(x.dueDate)===nm).reduce((a,x)=>a+Number(x.value||0),0),rm=r.filter(x=>monthKey(x.dueDate)===mk).reduce((a,x)=>a+Number(x.value||0),0),rn=r.filter(x=>monthKey(x.dueDate)===nm).reduce((a,x)=>a+Number(x.value||0),0);return `<div class=mini-kpis><div class=mini-kpi><small>A pagar — este mês</small><b>${money(pm)}</b></div><div class=mini-kpi><small>A receber — este mês</small><b>${money(rm)}</b></div><div class=mini-kpi><small>A pagar — próximo mês</small><b>${money(pn)}</b></div><div class=mini-kpi><small>A receber — próximo mês</small><b>${money(rn)}</b></div></div><br><div class=grid2><div class=card><div class=section-title><div><h2>Vencimentos deste mês</h2><span class=muted>Entradas e saídas previstas</span></div><button class=btn onclick="setFinanceTab('payables')">Ver contas a pagar</button></div>${dueRows([...p.filter(x=>monthKey(x.dueDate)===mk).map(x=>({...x,_type:'pay'})),...r.filter(x=>monthKey(x.dueDate)===mk).map(x=>({...x,_type:'rec'}))].sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||'')),10)}</div><div class=card><h2>Resultado e fluxo</h2><div class=summary><div class=summary-row><span>Faturamento</span><b>${money(db.revenue)}</b></div><div class=summary-row><span>Custos fixos</span><b>${money(db.fixedCosts)}</b></div><div class="summary-row total"><span>Resultado estimado</span><b>${money(db.revenue-db.fixedCosts)}</b></div></div></div></div><br><div class=card><div class=section-title><div><h2>Próximo mês</h2><span class=muted>Planejamento de caixa</span></div></div>${dueRows([...p.filter(x=>monthKey(x.dueDate)===nm).map(x=>({...x,_type:'pay'})),...r.filter(x=>monthKey(x.dueDate)===nm).map(x=>({...x,_type:'rec'}))].sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||'')),10)}</div><br><div class=card><div class=section-title><div><h2>Faturas de cartão</h2><span class=muted>Itens pagos no crédito ficam vinculados aqui e não devem ser somados novamente ao lançar a fatura global.</span></div></div>${(db.cardInvoices||[]).length?db.cardInvoices.map(i=>`<div class=account-row><div><b>${esc(i.description)}</b><small class=muted>${esc(i.id)} • ${esc(i.status)}</small></div><strong>${money(i.total)}</strong></div>`).join(''):'<div class=empty>Nenhuma fatura de cartão vinculada.</div>'}</div>`}function dueRows(list,limit){if(!list.length)return '<div class=empty>Nenhum vencimento neste período.</div>';return `<div class=account-list>${list.slice(0,limit).map(x=>`<div class=account-row><div><b>${esc(x.description||x.client||'Conta')}</b><small class=muted>${x._type==='pay'?'Saída':'Entrada'} • ${esc(x.category||'')}</small></div><div><small class=muted>Vencimento</small>${esc(x.dueDate||'-')}</div><div><span class="badge ${x._type==='pay'?'warn':'ok'}">${x._type==='pay'?'A pagar':'A receber'}</span></div><strong>${money(x.value)}</strong></div>`).join('')}</div>`}
function financeAccounts(type){let arr=type==='payable'?db.payables:db.receivables,title=type==='payable'?'Contas a pagar':'Contas a receber',tm=arr.filter(x=>monthKey(x.dueDate)===currentMonth()).reduce((a,x)=>a+Number(x.value||0),0),nm=arr.filter(x=>monthKey(x.dueDate)===nextMonth()).reduce((a,x)=>a+Number(x.value||0),0);return `<div class=mini-kpis><div class=mini-kpi><small>Total cadastrado</small><b>${money(arr.reduce((a,x)=>a+Number(x.value||0),0))}</b></div><div class=mini-kpi><small>Este mês</small><b>${money(tm)}</b></div><div class=mini-kpi><small>Próximo mês</small><b>${money(nm)}</b></div><div class=mini-kpi><small>Em aberto</small><b>${arr.filter(x=>!['paid','received'].includes(x.status)).length}</b></div></div><br><div class=card><div class=section-title><div><h2>${title}</h2><span class=muted>Cadastre, filtre, edite, liquide e acompanhe documentos.</span></div><button class="btn primary" onclick="openAccount('${type}')">+ Nova conta</button></div><div class=filters><input id=afilter placeholder="Buscar descrição, cliente ou fornecedor" oninput="filterAccounts('${type}')"><select id=amonth onchange="filterAccounts('${type}')"><option value=all>Todos os meses</option><option value="${currentMonth()}">Este mês</option><option value="${nextMonth()}">Próximo mês</option></select><select id=astatus onchange="filterAccounts('${type}')"><option value=all>Todos os status</option><option value=pending>Em aberto</option><option value=paid>Concluído</option><option value=overdue>Atrasado</option></select><select id=acat onchange="filterAccounts('${type}')"><option value=all>Todas as categorias</option>${[...new Set(arr.map(x=>x.category||'Operacional'))].map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div id=accountList>${accountRows(type,arr)}</div></div>`}function accountRows(type,arr){if(!arr.length)return '<div class=empty>Nenhuma conta cadastrada.</div>';return `<div class=account-list>${arr.slice().sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||'')).map(x=>{let done=type==='payable'?x.status==='paid':x.status==='received',st=done?'Concluído':(monthKey(x.dueDate)<currentMonth()?'Atrasado':monthKey(x.dueDate)===currentMonth()?'Este mês':'Próximo mês');return `<div class=account-row data-search="${esc((x.description||'')+' '+(x.client||'')+' '+(x.supplier||'')+' '+(x.category||''))}" data-month="${monthKey(x.dueDate)}" data-status="${done?'paid':st==='Atrasado'?'overdue':'pending'}" data-cat="${esc(x.category||'')}"><div><b>${esc(x.description||x.client||'Conta')}</b><small class=muted>${esc(x.supplier||x.client||'')} • ${esc(x.category||'')}${x.attachmentName?' • 📎 '+esc(x.attachmentName):''}</small></div><div><small class=muted>Vencimento</small><br>${esc(x.dueDate||'-')}</div><div><span class="badge ${done?'ok':st==='Atrasado'?'danger':'warn'}">${st}</span></div><div class=amount>${money(x.value)}</div><div class=account-actions><button class=btn onclick="editAccount('${type}',${x.id})">Editar</button>${done?'':`<button class="btn ok" onclick="completeAccount('${type}',${x.id})">${type==='payable'?'Pagar':'Receber'}</button>`}<button class="btn danger" onclick="deleteAccount('${type}',${x.id})">Excluir</button></div></div>`}).join('')}</div>`}function filterAccounts(type){let q=(document.getElementById('afilter').value||'').toLowerCase(),m=document.getElementById('amonth').value,s=document.getElementById('astatus').value,c=document.getElementById('acat').value;document.querySelectorAll('#accountList .account-row').forEach(row=>{row.style.display=(!q||row.dataset.search.toLowerCase().includes(q))&&(m==='all'||row.dataset.month===m)&&(s==='all'||row.dataset.status===s)&&(c==='all'||row.dataset.cat===c)?'grid':'none'})}
function openAccount(type,id=null){let x=id?(type==='payable'?db.payables:db.receivables).find(a=>a.id===id):null,isP=type==='payable';showModal(x?'Editar conta':'Nova conta',`<div class=two><div class=field><label>${isP?'Fornecedor':'Cliente'}</label><input id=accparty value="${esc(x?.supplier||x?.client||'')}" placeholder="Nome"></div><div class=field><label>Descrição</label><input id=accdesc value="${esc(x?.description||'')}" placeholder="Ex.: Produtos / serviço"></div></div><div class=grid3><div class=field><label>Valor (R$)</label><input id=accvalue type=number min=0 step=.01 value="${x?.value||''}"></div><div class=field><label>Vencimento</label><input id=accdate type=date value="${x?.dueDate||new Date().toISOString().slice(0,10)}"></div><div class=field><label>Forma</label><select id=accmethod>${['Pix','Cartão de Crédito','Cartão de Débito','Boleto','Dinheiro','Transferência'].map(m=>`<option ${m===(x?.method||'Pix')?'selected':''}>${m}</option>`).join('')}</select></div></div><div class=two><div class=field><label>Categoria</label><select id=acccat>${['Operacional','Produtos','Aluguel','Folha','Impostos','Marketing','Serviços','Cartão de Crédito','Outros'].map(c=>`<option ${c===(x?.category||'Operacional')?'selected':''}>${c}</option>`).join('')}</select></div><div class=field><label>Observações</label><input id=accnote value="${esc(x?.note||'')}" placeholder="Opcional"></div></div><div class=attachment-box><b>Anexo do lançamento</b><div class=muted>Use a câmera para fotografar o comprovante ou selecione uma imagem/PDF.</div><input id=accfile type=file accept="image/*,.pdf" capture="environment"><small class=muted>${x?.attachmentName?'Anexo atual: '+esc(x.attachmentName):'Nenhum anexo selecionado.'}</small></div><br><div class=actions><button class="btn outline" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveAccount('${type}',${id||0})">Salvar conta</button></div>`)}
function saveAccount(type,id){let party=document.getElementById('accparty').value.trim(),desc=document.getElementById('accdesc').value.trim(),value=Number(document.getElementById('accvalue').value)||0,dueDate=document.getElementById('accdate').value,method=document.getElementById('accmethod').value,category=document.getElementById('acccat').value,note=document.getElementById('accnote').value.trim(),file=document.getElementById('accfile')?.files?.[0];if(!party||!desc||!value||!dueDate){toast('Preencha nome, descrição, valor e vencimento.');return}let arr=type==='payable'?db.payables:db.receivables,x=id?arr.find(a=>a.id===id):null,finish=(attachment)=>{let data={description:desc,value,dueDate,method,category,note,attachmentName:attachment?.name||x?.attachmentName||'',attachmentType:attachment?.type||x?.attachmentType||'',attachmentData:attachment?.data||x?.attachmentData||''};if(x)Object.assign(x,data,type==='payable'?{supplier:party}:{client:party});else arr.push({id:Date.now(),...data,status:'pending',...(type==='payable'?{supplier:party}:{client:party})});save();closeModal();toast(id?'Conta atualizada.':'Conta cadastrada.');render()};if(file){let fr=new FileReader();fr.onload=()=>finish({name:file.name,type:file.type,data:fr.result});fr.readAsDataURL(file)}else finish(null)}function editAccount(type,id){openAccount(type,id)}
function completeAccount(type,id){let arr=type==='payable'?db.payables:db.receivables,x=arr.find(a=>a.id===id);if(!x)return;if(type==='payable'&&x.method==='Cartão de Crédito'){x.status='paid';x.completedAt=new Date().toLocaleString('pt-BR');x.creditCardSettled=true;x.costRecognized=false;x.cardInvoiceId=x.cardInvoiceId||('CC-'+monthKey(x.dueDate));db.cardInvoices=db.cardInvoices||[];let inv=db.cardInvoices.find(i=>i.id===x.cardInvoiceId);if(!inv){inv={id:x.cardInvoiceId,description:'Fatura cartão '+monthLabel(monthKey(x.dueDate)),total:0,status:'open',dueDate:x.dueDate};db.cardInvoices.push(inv)}if(!x.linkedToInvoice){inv.total+=Number(x.value||0);x.linkedToInvoice=true}x.note=(x.note?x.note+' | ':'')+'Liquidada no cartão; vinculada à '+inv.id+' sem duplicar o custo ao lançar a fatura global.';save();toast('Conta liquidada e vinculada à fatura do cartão.');render();return}x.status=type==='payable'?'paid':'received';x.completedAt=new Date().toLocaleString('pt-BR');x.costRecognized=type==='payable';save();toast(type==='payable'?'Conta paga.':'Recebimento confirmado.');render()}
function deleteAccount(type,id){let arr=type==='payable'?db.payables:db.receivables,x=arr.find(a=>a.id===id);if(!x)return;if(!confirm('Excluir este lançamento?'))return;arr.splice(arr.indexOf(x),1);save();toast('Lançamento excluído.');render()}function exportCSV(){let rows=[['TIPO','Pessoa','Descricao','Vencimento','Valor','Categoria','Forma','Status','Anexo','FaturaCartao']];db.payables.forEach(x=>rows.push(['A PAGAR',x.supplier,x.description,x.dueDate,x.value,x.category,x.method,x.status,x.attachmentName||'',x.cardInvoiceId||'']));db.receivables.forEach(x=>rows.push(['A RECEBER',x.client,x.description,x.dueDate,x.value,x.category,x.method,x.status,x.attachmentName||'','']));let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\n');let a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='ED_DU_gestao_contas.csv';a.click();toast('CSV exportado.')}
function showModal(title,body){let m=document.getElementById('modal');m.innerHTML=`<div class=modal><div class=modal-head><h2>${esc(title)}</h2><button class=btn onclick="closeModal()" aria-label="Fechar">✕</button></div>${body}</div>`;m.classList.add('show');setTimeout(()=>{document.getElementById('od')?.addEventListener('input',recalcOrderModal);recalcOrderModal()},0)}function closeModal(){document.getElementById('modal').classList.remove('show')}document.addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function client(){let p=app.clientPage;if(p==='book')return clientBook();if(p==='appointments')return clientAppointments();if(p==='payments')return clientPayments();return clientHome()}function clientHome(){let c=db.clients[0];return `<div class=content><div class=page-head><div><h1>Olá, ${esc(c.name.split(' ')[0])}! 👋</h1><p>Bem-vinda à ED & DU | Terapia da Beleza.</p></div><div class=mini-kpi><small>Pontos Fidelidade</small><b>${c.points}</b></div></div><div class=actions><button class="btn primary" onclick="cgo('book')">+ Agendar</button><button class=btn onclick="cgo('appointments')">Meus agendamentos</button><button class=btn onclick="cgo('payments')">Pagamentos</button></div><br><div class=card><h2>Escolha seu serviço</h2><div class=grid3>${SERVICES.map(s=>`<button class=card style="text-align:left;cursor:pointer" onclick="startBooking(${s.id})"><b>${s.icon} ${s.n}</b><br><small class=muted>A partir de ${money(s.base)}</small></button>`).join('')}</div></div></div>`}function startBooking(id){app.clientPage='book';booking.serviceId=id;render()}let booking={serviceId:null,prof:null,date:'',time:''};function clientBook(){let b=booking;return `<div class=content><div class=page-head><div><h1>Agendar atendimento</h1><p>1 Serviço → 2 Profissional → 3 Data → 4 Hora → 5 Confirmar</p></div></div><div class=card><h2>1. Serviço</h2><div class=grid3>${SERVICES.map(s=>`<button class="card ${b.serviceId===s.id?'primary':''}" onclick="booking.serviceId=${s.id};render()"><b>${s.n}</b><br><small>Base ${money(s.base)} • Longo ${money(s.long)}</small></button>`).join('')}</div><br><h2>2. Profissional</h2><div class=actions>${PROS.map(p=>`<button class="btn ${b.prof===p?'primary':''}" onclick="booking.prof='${p}';render()">${p}</button>`).join('')}</div><br><div class=two><div class=field><label>3. Data</label><input type=date value="${b.date}" onchange="booking.date=this.value"></div><div class=field><label>4. Hora</label><select onchange="booking.time=this.value"><option value="">Selecione</option>${['09:00','10:30','14:00','16:00','16:30','18:00'].map(t=>`<option ${t===b.time?'selected':''}>${t}</option>`).join('')}</select></div></div><div class=summary><h3>5. Confirmar</h3><p>${b.serviceId?svc(b.serviceId).n:'Escolha o serviço'} • ${b.prof||'Escolha o profissional'} • ${b.date||'Escolha a data'} • ${b.time||'Escolha a hora'}</p><button class="btn primary" onclick="submitBooking()">Enviar solicitação</button></div></div></div>`}function submitBooking(){if(!booking.serviceId||!booking.prof||!booking.date||!booking.time){toast('Complete as etapas antes de enviar.');return}let s=svc(booking.serviceId);db.requests.unshift({id:Date.now(),clientId:1,client:db.clients[0].name,serviceId:s.id,service:s.n,prof:booking.prof,date:booking.date,time:booking.time,status:'Pendente'});save();toast('Solicitação enviada.');app.clientPage='appointments';render()}function clientAppointments(){let r=db.requests.find(x=>x.clientId===1)||null;return `<div class=content><div class=page-head><div><h1>Meus agendamentos</h1><p>Acompanhe ou altere sua solicitação.</p></div></div><div class=card>${r?`<h2>${esc(r.service)}</h2><p>${esc(r.prof)} • ${r.date.split('-').reverse().join('/')} • ${r.time}</p><span class="badge ${r.status==='Aprovado'?'ok':'warn'}">${esc(r.status)}</span><br><br><div class=actions><button class=btn onclick="cgo('book')">Alterar agendamento</button><button class="btn danger" onclick="toast('Solicitação de cancelamento registrada.')">Solicitar cancelamento</button></div>`:'<p class=muted>Nenhum agendamento encontrado.</p>'}</div></div>`}function clientPayments(){let o=db.orders.find(x=>x.clientId===1&&!x.open);return `<div class=content><div class=page-head><div><h1>Pagamentos</h1><p>Você vê apenas o valor final da comanda.</p></div></div><div class=card>${o?`<h2>Comanda</h2><p>Valor final</p><h1>${money(orderCalc(o).net)}</h1><span class="badge ${o.payment==='paid'?'ok':'warn'}">${o.payment==='paid'?'Pago':'Aguardando pagamento'}</span>`:'<p class=muted>Nenhuma comanda disponível.</p>'}</div></div>`}
function render(){let r=document.getElementById('root');r.innerHTML=app.role==='pro'?({dashboard,requests,agenda,clients,orders,finance}[app.page]||dashboard)():client()}render();
</script>
</body></html>

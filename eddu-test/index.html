<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#242321">
<title>ED & DU | Terapia da Beleza</title>
<style>
:root{
 --bg:#f4f2ee;--surface:#fff;--surface2:#f8f6f2;--ink:#242321;--muted:#77736c;
 --line:#e6e1d9;--dark:#242321;--accent:#8d8173;--accent2:#d9cfc1;
 --ok:#3f7657;--okbg:#e5f1e9;--warn:#8b692f;--warnbg:#f4ecd9;--danger:#9b4d4d;--dangerbg:#f6e3e3;
 --shadow:0 8px 30px rgba(36,35,33,.06);--radius:22px
}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}body{min-height:100vh}.app{min-height:100vh}.appbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:14px 22px}.brand{display:flex;gap:12px;align-items:center}.brandmark{width:56px;height:56px;border-radius:18px;background:var(--dark);color:#fff;display:grid;place-items:center;font-weight:800;font-size:25px}.brandtext{display:flex;flex-direction:column;line-height:1.1}.brandtext b{font-size:21px}.brandtext span{font-size:14px;color:var(--muted);margin-top:6px}.role{display:flex;gap:4px;background:#eeeae4;padding:4px;border-radius:16px}.role button{padding:10px 16px;border-radius:13px;background:transparent;color:var(--ink)}.role button.active{background:var(--dark);color:#fff;font-weight:700}.shell{max-width:1180px;margin:0 auto;padding:28px 22px 110px}.navs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}.nav{background:#eeebe5;color:var(--ink);padding:14px 20px;border-radius:16px;font-size:17px}.nav.active{background:var(--dark);color:#fff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.metric,.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.metric{padding:28px}.metric span{color:var(--muted);font-size:16px}.metric strong{display:block;font-size:34px;margin-top:7px}.card{padding:24px}.card h2,.card h3{margin:0 0 8px}.page-head{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:20px}.page-head h1{font-size:32px;margin:0}.page-head p{margin:7px 0 0;color:var(--muted)}.btn{padding:12px 17px;border-radius:14px;background:#eeeae5;color:var(--ink)}.btn.primary{background:var(--dark);color:#fff}.btn.danger{background:var(--dangerbg);color:var(--danger)}.btn.small{padding:9px 12px;font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);vertical-align:top}.table th{font-size:13px;color:var(--muted);font-weight:600}.badge{display:inline-block;padding:6px 9px;border-radius:10px;background:#eeeae5;font-size:12px}.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.danger{background:var(--dangerbg);color:var(--danger)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:13px;color:var(--muted);font-weight:600}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px 13px;background:#fff;outline:none}.field textarea{min-height:100px;resize:vertical}.section-gap{margin-top:18px}.list{display:grid;gap:12px}.item{padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface2)}.item-head{display:flex;justify-content:space-between;gap:12px}.muted{color:var(--muted)}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}.bottom-nav button{background:transparent;padding:8px 14px;border-radius:12px;color:var(--muted);min-width:90px}.bottom-nav button.active{color:var(--ink);font-weight:700;background:#f0ede8}.client-shell{max-width:900px;margin:0 auto}.client-tabs{display:flex;gap:8px;overflow:auto;margin-bottom:20px}.client-tabs button{white-space:nowrap;background:#eeeae5;padding:11px 15px;border-radius:13px}.client-tabs button.active{background:var(--dark);color:#fff}.hero{background:var(--dark);color:#fff;border-radius:28px;padding:28px;margin-bottom:18px}.hero p{color:#d9d5cf}.points{font-size:34px;font-weight:800}.steps{display:flex;gap:8px;overflow:auto;margin:16px 0}.step{padding:9px 12px;border-radius:12px;background:#eeeae5;color:var(--muted);white-space:nowrap}.step.active{background:var(--dark);color:#fff}.service-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.service{border:1px solid var(--line);background:#fff;border-radius:17px;padding:17px;text-align:left}.service.selected{border:2px solid var(--dark)}.service b{display:block;font-size:17px}.service span{color:var(--muted);font-size:13px}.summary{padding:18px;background:var(--surface2);border-radius:18px;margin-top:14px}.modal-backdrop{position:fixed;inset:0;background:rgba(20,18,15,.45);z-index:100;display:grid;place-items:center;padding:18px}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.22)}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.close{background:#eeeae5;border-radius:12px;width:38px;height:38px}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.photo-grid img{width:100%;aspect-ratio:1;border-radius:14px;object-fit:cover;border:1px solid var(--line)}.notice{padding:14px 16px;border-radius:15px;background:var(--warnbg);color:var(--warn)}.success{padding:14px 16px;border-radius:15px;background:var(--okbg);color:var(--ok)}.finance-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.finance-tabs button{padding:11px 15px;border-radius:13px;background:#eeeae5}.finance-tabs button.active{background:var(--dark);color:#fff}.empty{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:850px){.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.shell{padding:22px 14px 100px}.appbar{padding:12px 14px}.brandmark{width:48px;height:48px}.brandtext b{font-size:18px}.role button{padding:9px 11px}.nav{font-size:15px;padding:12px 14px}.page-head{align-items:start;flex-direction:column}.page-head h1{font-size:28px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.table-wrap{overflow:auto}.table{min-width:720px}.service-grid{grid-template-columns:1fr}.photo-grid{grid-template-columns:repeat(2,1fr)}.bottom-nav{justify-content:space-around}.bottom-nav button{min-width:0;padding:8px 6px;font-size:12px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const SERVICES=[
{id:1,n:'Corte Feminino',base:110,long:140,cost:49,time:60,icon:'✂️'},
{id:2,n:'Corte Masculino',base:89,long:89,cost:31,time:45,icon:'✂️'},
{id:3,n:'Corte + Secagem',base:136,long:166,cost:56,time:75,icon:'💇'},
{id:4,n:'Escova Efeito Lis',base:99,long:130,cost:46,time:60,icon:'✨'},
{id:5,n:'Escova com Text.',base:112,long:140,cost:53,time:60,icon:'✨'},
{id:6,n:'Lava e seca',base:89,long:99,cost:29,time:45,icon:'🫧'},
{id:7,n:'Bio Nutrição',base:89,long:99,cost:41,time:60,icon:'🌿'},
{id:8,n:'Bio Reconstrução',base:149,long:179,cost:50,time:75,icon:'🌿'},
{id:9,n:'Coloração Avulso',base:189,long:289,cost:110,time:120,icon:'🎨'},
{id:10,n:'Selagem 3d',base:229,long:329,cost:180,time:150,icon:'✨'},
{id:11,n:'Escova progressiva',base:289,long:389,cost:180,time:180,icon:'✨'},
{id:12,n:'Alisamento',base:259,long:359,cost:180,time:180,icon:'✨'},
{id:13,n:'Combo Mechas Dia',base:729,long:849,cost:315,time:240,icon:'🌟'},
{id:14,n:'Combo Master',base:1599,long:1999,cost:802,time:300,icon:'🌟'},
{id:15,n:'Combo Coloração',base:249,long:349,cost:170,time:180,icon:'🎨'},
{id:16,n:'Combo Terapia',base:599,long:799,cost:197,time:180,icon:'💆'}
];
const db={clients:[{id:1,name:'Cliente Teste',phone:'(11) 99999-9999',email:'cliente@teste.com',birth:'1990-01-01',notes:'Cliente de demonstração',anamneses:[],docs:[],points:180}],requests:[],orders:[{id:1001,clientId:1,client:'Cliente Teste',items:[{serviceId:13,length:'base'}],discount:0,status:'Aberta',payment:'—',created:Date.now()}],payables:[],receivables:[]};
const app={role:'pro',page:'dashboard',clientPage:'home',modal:null,editingClient:null};
const booking={serviceId:null,prof:null,date:null,time:null,length:'base',status:null};
const professionals=['Profissional ED','Profissional DU'];
const fmt=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const dt=s=>s?new Date(s).toLocaleDateString('pt-BR'):'';
const dtime=s=>s?new Date(s).toLocaleString('pt-BR'):'—';
function save(){localStorage.setItem('eddu_demo_v10',JSON.stringify(db))}
try{const x=JSON.parse(localStorage.getItem('eddu_demo_v10'));if(x){Object.assign(db,x)}}catch(e){}
function svc(id){return SERVICES.find(s=>s.id==id)}
function setRole(r){app.role=r;app.page=r==='pro'?'dashboard':'home';render()}
function go(p){app.page=p;render()}
function cgo(p){app.clientPage=p;render()}
function orderCalc(o){let sub=0,cost=0;(o.items||[]).forEach(i=>{let s=svc(i.serviceId);sub+=(i.length==='long'?s.long:s.base);cost+=s.cost});let discount=Math.max(0,Math.min(Number(o.discount)||0,sub));let net=sub-discount,commission=net*.30,profit=net-cost-commission;return{sub,discount,net,cost,commission,profit}}
function header(){return `<header class="appbar"><div class="brand"><div class="brandmark">E</div><div class="brandtext"><b>ED & DU</b><span>Terapia da Beleza</span></div></div><div class="role"><button class="${app.role==='pro'?'active':''}" onclick="setRole('pro')">Profissional</button><button class="${app.role==='client'?'active':''}" onclick="setRole('client')">Cliente</button></div></header>`}
function proNav(){let ns=[['dashboard','⌂','Dashboard'],['requests','◉','Solicitações'],['agenda','▣','Agenda'],['clients','♙','Clientes'],['orders','▤','Comandas'],['finance','◔','Financeiro']];return ns.map(n=>`<button class="nav ${app.page===n[0]?'active':''}" onclick="go('${n[0]}')">${n[1]} &nbsp; ${n[2]}</button>`).join('')}
function bottomNav(){let ns=[['dashboard','⌂','Início'],['agenda','▣','Agenda'],['orders','▤','Comandas'],['clients','♙','Clientes']];return `<nav class="bottom-nav">${ns.map(n=>`<button class="${app.page===n[0]?'active':''}" onclick="go('${n[0]}')"><span>${n[1]}</span><br>${n[2]}</button>`).join('')}</nav>`}
function pro(){let content=app.page==='dashboard'?dashboard():app.page==='requests'?requests():app.page==='agenda'?agenda():app.page==='clients'?clients():app.page==='orders'?orders():finance();return `${header()}<main class="shell"><div class="navs">${proNav()}</div>${content}</main>${bottomNav()}${app.modal||''}`}
function dashboard(){let revenue=db.orders.reduce((a,o)=>a+(o.status==='Fechada'?orderCalc(o).net:0),0)||82500;let costs=db.orders.reduce((a,o)=>a+(o.status==='Fechada'?orderCalc(o).cost+orderCalc(o).commission:0),0)||38200;let profit=revenue-costs;return `<div class="page-head"><div><h1>Dashboard</h1><p>Visão geral da operação do salão.</p></div><button class="btn primary" onclick="go('orders')">Abrir comandas</button></div><div class="grid"><div class="metric"><span>Faturamento</span><strong>${fmt(revenue)}</strong></div><div class="metric"><span>Custos</span><strong>${fmt(costs)}</strong></div><div class="metric"><span>Lucro</span><strong>${fmt(profit)}</strong></div></div><div class="two section-gap"><div class="card"><h2>Atalhos</h2><div class="actions" style="margin-top:18px"><button class="btn primary" onclick="go('orders')">Abrir Comandas</button><button class="btn" onclick="go('agenda')">Abrir Agenda</button><button class="btn" onclick="openNewClient()">Novo cliente</button></div></div><div class="card"><h2>Resumo</h2><p class="muted">${db.requests.length} solicitação(ões) pendente(s)</p><p class="muted">${db.payables.length} conta(s) a pagar</p><p class="muted">${db.receivables.filter(x=>x.status!=='Recebido').length} recebimento(s) em aberto</p></div></div>`}
function requests(){return `<div class="page-head"><div><h1>Solicitações</h1><p>Aprove, reprograme ou inicie atendimentos.</p></div></div><div class="list">${db.requests.length?db.requests.map(r=>`<div class="item"><div class="item-head"><div><b>${esc(r.client)}</b><div class="muted">${esc(r.service)} • ${esc(r.prof)} • ${esc(r.date)} ${esc(r.time)}</div></div><span class="badge warn">${esc(r.status)}</span></div><div class="actions" style="margin-top:12px"><button class="btn primary small" onclick="approveReq(${r.id})">Aprovar</button><button class="btn small" onclick="rescheduleReq(${r.id})">Reagendar</button><button class="btn small" onclick="startReq(${r.id})">Iniciar atendimento</button></div></div>`).join(''):`<div class="card empty">Nenhuma solicitação pendente.</div>`}</div>`}
function approveReq(id){let r=db.requests.find(x=>x.id===id);if(r){r.status='Aprovado';save();toast('Solicitação aprovada.');render()}}
function rescheduleReq(id){let r=db.requests.find(x=>x.id===id);if(!r)return;let d=prompt('Nova data (AAAA-MM-DD):',r.date);let t=prompt('Novo horário:',r.time);if(d&&t){r.date=d;r.time=t;r.status='Reagendado';save();render()}}
function startReq(id){let r=db.requests.find(x=>x.id===id);if(r){r.status='Em atendimento';let o={id:Date.now(),clientId:r.clientId,client:r.client,items:[{serviceId:r.serviceId,length:'base'}],discount:0,status:'Aberta',payment:'—',created:Date.now()};db.orders.unshift(o);save();go('orders')}}
function agenda(){let rows=db.requests.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return `<div class="page-head"><div><h1>Agenda</h1><p>Agendamentos, comandos e atendimento.</p></div><button class="btn" onclick="alert('Integração Google Calendar preparada para a etapa de backend.')">Google Calendar</button></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Data</th><th>Horário</th><th>Cliente</th><th>Serviço</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.time)}</td><td>${esc(r.client)}</td><td>${esc(r.service)}</td><td><span class="badge ${r.status==='Aprovado'?'ok':'warn'}">${esc(r.status)}</span></td><td><div class="actions"><button class="btn small" onclick="editReq(${r.id})">Editar</button><button class="btn small primary" onclick="openOrderForReq(${r.id})">Abrir comando</button></div></td></tr>`).join(''):`<tr><td colspan="6" class="empty">Nenhum agendamento.</td></tr>`}</tbody></table></div></div>`}
function editReq(id){let r=db.requests.find(x=>x.id===id);if(!r)return;let d=prompt('Data:',r.date),t=prompt('Horário:',r.time);if(d)r.date=d;if(t)r.time=t;save();render()}
function openOrderForReq(id){let r=db.requests.find(x=>x.id===id);if(!r)return;let o=db.orders.find(x=>x.clientId===r.clientId&&x.status==='Aberta');if(!o){o={id:Date.now(),clientId:r.clientId,client:r.client,items:[{serviceId:r.serviceId,length:'base'}],discount:0,status:'Aberta',payment:'—',created:Date.now()};db.orders.unshift(o);save()}go('orders')}
function clients(){return `<div class="page-head"><div><h1>Clientes</h1><p>Cadastro, histórico, anamnese e documentos.</p></div><button class="btn primary" onclick="openNewClient()">+ Novo cliente</button></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Cliente</th><th>Contato</th><th>Documentos</th><th>Ações</th></tr></thead><tbody>${db.clients.map(c=>`<tr><td><b>${esc(c.name)}</b><br><span class="muted">${esc(c.email||'')}</span></td><td>${esc(c.phone||'')}</td><td>${c.docs.length} documento(s)</td><td><div class="actions"><button class="btn small" onclick="openClient(${c.id})">Abrir ficha</button><button class="btn small" onclick="whats('${esc(c.phone||'')}')">WhatsApp</button></div></td></tr>`).join('')}</tbody></table></div></div>`}
function openNewClient(){app.modal=clientModal(null);render()}
function openClient(id){app.modal=clientModal(db.clients.find(c=>c.id===id));render()}
function clientModal(c){c=c||{id:0,name:'',phone:'',email:'',birth:'',notes:'',anamneses:[],docs:[],points:0};return `<div class="modal-backdrop"><div class="modal"><div class="modal-head"><div><h2>${c.id?'Ficha do cliente':'Novo cliente'}</h2><p class="muted">Cadastro e prontuário de demonstração.</p></div><button class="close" onclick="app.modal=null;render()">×</button></div><div class="form-grid section-gap"><div class="field"><label>Nome</label><input id="cn" value="${esc(c.name)}"></div><div class="field"><label>WhatsApp</label><input id="cp" value="${esc(c.phone)}"></div><div class="field"><label>E-mail</label><input id="ce" value="${esc(c.email)}"></div><div class="field"><label>Data de nascimento</label><input id="cb" type="date" value="${esc(c.birth)}"></div><div class="field full"><label>Observações iniciais</label><textarea id="co">${esc(c.notes)}</textarea></div></div><div class="actions section-gap"><button class="btn primary" onclick="saveClient(${c.id})">Salvar cadastro</button></div>${c.id?`<div class="section-gap"><h3>Anamnese / avaliação</h3><div class="card" style="background:var(--surface2)"><div class="form-grid"><div class="field"><label>Data e hora</label><input id="ad" type="datetime-local"></div><div class="field"><label>Procedimento</label><input id="ap" placeholder="Procedimento realizado"></div><div class="field full"><label>Parecer profissional</label><textarea id="ao" placeholder="Avaliação e orientação profissional"></textarea></div><div class="field full"><label>Riscos / contraindicações</label><textarea id="ar" placeholder="Riscos identificados, contraindicações e cuidados"></textarea></div><div class="field full"><label>Fotos</label><input id="af" type="file" accept="image/*" multiple></div></div><div class="actions section-gap"><button class="btn primary" onclick="saveAnam(${c.id})">Salvar anamnese</button></div></div><div class="list section-gap">${c.anamneses.map(a=>`<div class="item"><b>${esc(a.procedure)}</b><div class="muted">${dtime(a.date)}</div><p>${esc(a.opinion)}</p><p><b>Riscos/contraindicações:</b> ${esc(a.risks||'Não informado')}</p>${a.photos?.length?`<div class="photo-grid">${a.photos.map(p=>`<img src="${p}" alt="Foto da anamnese">`).join('')}</div>`:''}<div class="actions" style="margin-top:12px"><button class="btn small primary" onclick="shareAnam(${c.id},${a.id})">Enviar para revisão do cliente</button></div></div>`).join('')||'<div class="empty">Nenhuma anamnese registrada.</div>'}</div></div><div class="section-gap"><h3>Documentos enviados</h3>${c.docs.length?c.docs.map(d=>`<div class="item"><b>${esc(d.title)}</b><div class="muted">Enviado em ${dtime(d.sentAt)}</div>${d.acceptedAt?`<div class="success" style="margin-top:10px">Cliente deu acordo em ${dtime(d.acceptedAt)}.</div>`:'<div class="notice" style="margin-top:10px">Aguardando leitura e acordo do cliente.</div>'}</div>`).join(''):'<div class="empty">Nenhum documento enviado.</div>'}</div>`:''}</div></div>`}
function saveClient(id){let data={name:document.getElementById('cn').value,phone:document.getElementById('cp').value,email:document.getElementById('ce').value,birth:document.getElementById('cb').value,notes:document.getElementById('co').value};if(id){Object.assign(db.clients.find(c=>c.id===id),data)}else{db.clients.push({...data,id:Date.now(),anamneses:[],docs:[],points:0})}save();app.modal=null;toast('Cadastro salvo.');render()}
async function saveAnam(cid){let c=db.clients.find(x=>x.id===cid);if(!c)return;let files=[...document.getElementById('af').files];let photos=await Promise.all(files.map(f=>new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)})));c.anamneses.unshift({id:Date.now(),date:document.getElementById('ad').value||new Date().toISOString().slice(0,16),procedure:document.getElementById('ap').value||'Procedimento',opinion:document.getElementById('ao').value,risks:document.getElementById('ar').value,photos});save();toast('Anamnese registrada no histórico.');app.modal=clientModal(c);render()}
function shareAnam(cid,aid){let c=db.clients.find(x=>x.id===cid),a=c?.anamneses.find(x=>x.id===aid);if(!c||!a)return;const term=`TERMO DE RESPONSABILIDADE — ED & DU | Terapia da Beleza\n\nDeclaro que li as informações da avaliação, procedimento, parecer profissional, riscos e contraindicações apresentados neste documento. Estou ciente das orientações recebidas e confirmo meu acordo para o procedimento, conforme as informações disponibilizadas no aplicativo.`;c.docs.unshift({id:Date.now(),title:`Anamnese — ${a.procedure}`,sentAt:new Date().toISOString(),anam:a,term,acceptedAt:null});save();toast('Anamnese e termo enviados para a área do cliente.');app.modal=clientModal(c);render()}
function whats(phone){if(!phone)return;window.open('https://wa.me/55'+phone.replace(/\D/g,''),'_blank')}
function orders(){return `<div class="page-head"><div><h1>Comandas</h1><p>Valores, comissão, custo e lucro ficam visíveis somente para o profissional.</p></div><button class="btn primary" onclick="newOrder()">+ Nova comanda</button></div><div class="list">${db.orders.map(o=>{let x=orderCalc(o);return `<div class="card"><div class="item-head"><div><h3>Comanda #${o.id}</h3><div class="muted">${esc(o.client)}</div></div><span class="badge ${o.status==='Fechada'?'ok':''}">${o.status}</span></div><div class="section-gap"><b>Serviços</b><ul>${o.items.map(i=>`<li>${esc(svc(i.serviceId).n)} — ${i.length==='long'?'Longo':'Base'} — ${fmt(i.length==='long'?svc(i.serviceId).long:svc(i.serviceId).base)}</li>`).join('')}</ul><div class="grid"><div class="item"><span class="muted">Total</span><h3>${fmt(x.net)}</h3></div><div class="item"><span class="muted">Custo</span><h3>${fmt(x.cost)}</h3></div><div class="item"><span class="muted">Comissão 30%</span><h3>${fmt(x.commission)}</h3></div></div><div class="actions" style="margin-top:14px">${o.status==='Aberta'?`<button class="btn primary" onclick="closeOrder(${o.id})">Fechar comanda</button>`:`<span class="success">Lucro: ${fmt(x.profit)}</span>`}<button class="btn" onclick="editOrder(${o.id})">Editar</button></div></div></div>`}).join('')}</div>`}
function newOrder(){let c=db.clients[0];db.orders.unshift({id:Date.now(),clientId:c.id,client:c.name,items:[{serviceId:1,length:'base'}],discount:0,status:'Aberta',payment:'—',created:Date.now()});save();render()}
function editOrder(id){let o=db.orders.find(x=>x.id===id);if(!o)return;let disc=prompt('Desconto (R$):',o.discount||0);if(disc!==null)o.discount=Number(disc)||0;save();render()}
function closeOrder(id){let o=db.orders.find(x=>x.id===id);if(!o)return;app.modal=closeOrderModal(o);render()}
function closeOrderModal(o){let x=orderCalc(o);let today=new Date();today.setDate(today.getDate()+1);let first=today.toISOString().slice(0,10);return `<div class="modal-backdrop"><div class="modal"><div class="modal-head"><div><h2>Fechar comanda #${o.id}</h2><p class="muted">Total para o cliente: ${fmt(x.net)}</p></div><button class="close" onclick="app.modal=null;render()">×</button></div><div class="section-gap"><div class="form-grid"><div class="field"><label>Forma de pagamento</label><select id="pay"><option>Pix</option><option>Cartão de crédito</option><option>Cartão de débito</option><option>Dinheiro</option><option>Boleto</option></select></div><div class="field"><label>Tipo</label><select id="ptype" onchange="toggleInstallments()"><option value="now">Pagamento normal</option><option value="internal">Parcelamento salão</option></select></div></div><div id="installmentBox" class="section-gap" style="display:none"><div class="form-grid"><div class="field"><label>Número de parcelas</label><input id="ninst" type="number" min="1" max="24" value="3"></div><div class="field"><label>Juros (%)</label><input id="interest" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Primeiro vencimento</label><input id="firstDue" type="date" value="${first}"></div><div class="field"><label>Método</label><select id="rmethod"><option>Pix</option><option>Boleto</option></select></div></div><p class="muted">O teste gera parcelas mensais e sinaliza vencimentos no dia anterior.</p></div></div><div class="actions section-gap"><button class="btn primary" onclick="finishClose(${o.id})">Confirmar fechamento</button></div></div></div>`}
function toggleInstallments(){let x=document.getElementById('installmentBox');if(x)x.style.display=document.getElementById('ptype').value==='internal'?'block':'none'}
function finishClose(id){let o=db.orders.find(x=>x.id===id),x=orderCalc(o);if(document.getElementById('ptype').value==='internal'){let n=Math.max(1,Math.min(24,Number(document.getElementById('ninst').value)||1)),rate=(Number(document.getElementById('interest').value)||0)/100,method=document.getElementById('rmethod').value,first=new Date(document.getElementById('firstDue').value+'T12:00:00');let total=x.net*(1+rate),part=total/n;for(let i=0;i<n;i++){let due=new Date(first);due.setMonth(due.getMonth()+i);db.receivables.push({id:Date.now()+i,clientId:o.clientId,client:o.client,orderId:o.id,installment:i+1,totalInstallments:n,due:due.toISOString(),amount:part,method,status:'Em aberto'})}o.payment='Parcelamento salão';}else{o.payment=document.getElementById('pay').value;o.paidAt=new Date().toISOString()}o.status='Fechada';save();app.modal=null;toast('Comanda fechada.');render()}
function finance(){let tab=app.financeTab||'dash';return `<div class="page-head"><div><h1>Financeiro</h1><p>Contas a pagar, contas a receber e resultado.</p></div></div><div class="finance-tabs"><button class="${tab==='dash'?'active':''}" onclick="app.financeTab='dash';render()">Dashboard</button><button class="${tab==='payables'?'active':''}" onclick="app.financeTab='payables';render()">Contas a pagar</button><button class="${tab==='receivables'?'active':''}" onclick="app.financeTab='receivables';render()">Contas a receber</button></div>${tab==='dash'?financeDash():tab==='payables'?payables():receivables()}`}
function financeDash(){let p=db.payables.reduce((a,x)=>a+Number(x.amount||0),0),r=db.receivables.filter(x=>x.status!=='Recebido').reduce((a,x)=>a+Number(x.amount||0),0);return `<div class="grid"><div class="metric"><span>Contas a pagar</span><strong>${fmt(p)}</strong></div><div class="metric"><span>A receber</span><strong>${fmt(r)}</strong></div><div class="metric"><span>Parcelas em aberto</span><strong>${db.receivables.filter(x=>x.status!=='Recebido').length}</strong></div></div><div class="two section-gap"><div class="card"><h2>Próximos vencimentos</h2>${[...db.payables.map(x=>({...x,type:'Pagar'})),...db.receivables.filter(x=>x.status!=='Recebido').map(x=>({...x,type:'Receber'}))].sort((a,b)=>new Date(a.due)-new Date(b.due)).slice(0,6).map(x=>`<div class="item" style="margin-top:10px"><b>${esc(x.description||x.client||x.type)}</b><div class="muted">${dt(x.due)} • ${fmt(x.amount)}</div></div>`).join('')||'<div class="empty">Nenhum vencimento cadastrado.</div>'}</div><div class="card"><h2>Controle</h2><p class="muted">O teste permite anexar comprovantes em PDF ou imagem nas contas a pagar.</p><p class="muted">Parcelamentos internos são criados diretamente no fechamento da comanda.</p></div></div>`}
function payables(){return `<div class="two"><div class="card"><h2>Nova conta a pagar</h2><div class="form-grid section-gap"><div class="field full"><label>Descrição</label><input id="pd" placeholder="Ex.: compra de produtos"></div><div class="field"><label>Categoria</label><select id="pc"><option>Consumo</option><option>Produtos</option><option>Aluguel</option><option>Serviços</option><option>Impostos</option><option>Outros</option></select></div><div class="field"><label>Valor</label><input id="pv" type="number" step="0.01"></div><div class="field"><label>Vencimento</label><input id="pdate" type="date"></div><div class="field"><label>Pagamento</label><select id="pm"><option>Pix</option><option>Boleto</option><option>Cartão de crédito recorrente</option><option>Cartão de crédito</option><option>Débito</option><option>Dinheiro</option></select></div><div class="field full"><label>Nota fiscal / cupom (PDF ou foto)</label><input id="pf" type="file" accept="application/pdf,image/*"></div></div><div class="actions section-gap"><button class="btn primary" onclick="addPayable()">Cadastrar conta</button></div></div><div class="card"><h2>Contas cadastradas</h2><div class="list section-gap">${db.payables.map(x=>`<div class="item"><div class="item-head"><b>${esc(x.description)}</b><span>${fmt(x.amount)}</span></div><div class="muted">Vence ${dt(x.due)} • ${esc(x.method)}</div>${x.attachment?'<div class="success" style="margin-top:8px">Comprovante anexado.</div>':''}<div class="actions" style="margin-top:8px"><button class="btn small" onclick="markPayable(${x.id})">Marcar pago</button></div></div>`).join('')||'<div class="empty">Nenhuma conta cadastrada.</div>'}</div></div></div>`}
async function addPayable(){let f=document.getElementById('pf').files[0],attachment=null;if(f)attachment=await new Promise(res=>{let r=new FileReader();r.onload=()=>res({name:f.name,type:f.type,data:r.result});r.readAsDataURL(f)});db.payables.unshift({id:Date.now(),description:document.getElementById('pd').value||'Conta',category:document.getElementById('pc').value,amount:Number(document.getElementById('pv').value)||0,due:document.getElementById('pdate').value,method:document.getElementById('pm').value,attachment,status:'Em aberto'});save();toast('Conta a pagar cadastrada.');render()}
function markPayable(id){let x=db.payables.find(x=>x.id===id);if(x)x.status='Pago';save();render()}
function receivables(){return `<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Cliente</th><th>Parcela</th><th>Vencimento</th><th>Valor</th><th>Método</th><th>Status</th><th>Ações</th></tr></thead><tbody>${db.receivables.length?db.receivables.map(x=>`<tr><td>${esc(x.client)}</td><td>${x.installment}/${x.totalInstallments}</td><td>${dt(x.due)}</td><td>${fmt(x.amount)}</td><td>${esc(x.method)}</td><td><span class="badge ${x.status==='Recebido'?'ok':'warn'}">${esc(x.status)}</span></td><td><div class="actions"><button class="btn small" onclick="receive(${x.id})">Receber</button><button class="btn small" onclick="remind(${x.id})">Lembrar</button></div></td></tr>`).join(''):`<tr><td colspan="7" class="empty">Nenhum recebimento pendente.</td></tr>`}</tbody></table></div></div>`}
function receive(id){let x=db.receivables.find(x=>x.id===id);if(x)x.status='Recebido';save();render()}
function remind(id){let x=db.receivables.find(x=>x.id===id);if(!x)return;let c=db.clients.find(c=>c.id===x.clientId);if(c)whats(c.phone);}
function client(){return `${header()}<main class="shell client-shell">${clientHomeTabs()}${app.clientPage==='home'?clientHome():app.clientPage==='book'?clientBook():app.clientPage==='appointments'?clientAppointments():app.clientPage==='documents'?clientDocuments():clientPayments()}</main>`}
function clientHomeTabs(){let ns=[['home','Início'],['book','Agendar'],['appointments','Agendamentos'],['documents','Documentos'],['payments','Pagamentos']];return `<div class="client-tabs">${ns.map(n=>`<button class="${app.clientPage===n[0]?'active':''}" onclick="cgo('${n[0]}')">${n[1]}</button>`).join('')}</div>`}
function clientHome(){let c=db.clients[0],due=db.receivables.find(x=>x.clientId===c.id&&x.status!=='Recebido'&&new Date(x.due).toDateString()===new Date(Date.now()+86400000).toDateString());return `<div class="hero"><p>Olá, ${esc(c.name)} 👋</p><h1>ED & DU</h1><p>Seu espaço de beleza e cuidado.</p><div class="points">${c.points} pontos</div><small>Programa de fidelidade</small></div>${due?`<div class="notice">Você tem uma parcela de ${fmt(due.amount)} com vencimento amanhã (${dt(due.due)}).</div>`:''}<div class="grid section-gap"><div class="card"><h2>Agendar</h2><p class="muted">Escolha serviço, profissional, data e horário.</p><button class="btn primary" onclick="cgo('book')">Agendar agora</button></div><div class="card"><h2>Meus documentos</h2><p class="muted">Veja sua anamnese, fotos, parecer e termo.</p><button class="btn" onclick="cgo('documents')">Abrir documentos</button></div><div class="card"><h2>Pagamentos</h2><p class="muted">Acompanhe suas parcelas e pagamentos.</p><button class="btn" onclick="cgo('payments')">Ver pagamentos</button></div></div>`}
function clientBook(){let b=booking;let dateMin=new Date().toISOString().slice(0,10);return `<div class="page-head"><div><h1>Novo agendamento</h1><p>Faça sua solicitação em 5 passos.</p></div></div><div class="steps">${['1. Serviço','2. Profissional','3. Data','4. Horário','5. Confirmar'].map((x,i)=>`<div class="step ${i===0&&!b.serviceId?'active':i===1&&b.serviceId&&!b.prof?'active':i===2&&b.prof&&!b.date?'active':i===3&&b.date&&!b.time?'active':i===4&&b.time?'active':''}">${x}</div>`).join('')}</div><div class="card"><h3>1. Serviço</h3><div class="service-grid section-gap">${SERVICES.map(s=>`<button class="service ${b.serviceId===s.id?'selected':''}" onclick="booking.serviceId=${s.id};render()"><b>${s.icon} ${esc(s.n)}</b><span>Base ${fmt(s.base)} • Longo ${fmt(s.long)}</span></button>`).join('')}</div><div class="section-gap"><h3>Comprimento</h3><div class="actions"><button class="btn ${b.length==='base'?'primary':''}" onclick="booking.length='base';render()">Base</button><button class="btn ${b.length==='long'?'primary':''}" onclick="booking.length='long';render()">Longo</button></div></div><div class="section-gap"><h3>2. Profissional</h3><div class="actions">${professionals.map(p=>`<button class="btn ${b.prof===p?'primary':''}" onclick="booking.prof='${p}';render()">${p}</button>`).join('')}</div></div><div class="section-gap"><h3>3. Data</h3><input type="date" min="${dateMin}" value="${b.date||''}" onchange="booking.date=this.value;render()" class="field" style="display:block;max-width:280px;border:1px solid var(--line);padding:12px;border-radius:13px;background:#fff"></div><div class="section-gap"><h3>4. Horário</h3><div class="actions">${['09:00','10:30','12:00','14:00','16:00','16:30','18:00'].map(t=>`<button class="btn ${b.time===t?'primary':''}" onclick="booking.time='${t}';render()">${t}</button>`).join('')}</div></div><div class="summary"><h3>5. Confirmar</h3><p>${b.serviceId?svc(b.serviceId).n:'Escolha o serviço'} • ${b.prof||'Escolha o profissional'} • ${b.date||'Escolha a data'} • ${b.time||'Escolha a hora'}</p><button class="btn primary" onclick="submitBooking()">Enviar solicitação</button></div></div>`}
function submitBooking(){if(!booking.serviceId||!booking.prof||!booking.date||!booking.time){toast('Complete as etapas na ordem antes de enviar.');return}let s=svc(booking.serviceId);db.requests.unshift({id:Date.now(),clientId:1,client:db.clients[0].name,serviceId:s.id,service:s.n,prof:booking.prof,date:booking.date,time:booking.time,status:'Pendente'});save();toast('Solicitação enviada: Pendente de aprovação.');booking.status='Pendente de aprovação';app.clientPage='appointments';render()}
function clientAppointments(){let r=db.requests.find(x=>x.clientId===1)||null;return `<div class="page-head"><div><h1>Meus agendamentos</h1><p>Acompanhe ou altere sua solicitação.</p></div></div><div class="card">${r?`<h2>${esc(r.service)}</h2><p>${esc(r.prof)} • ${r.date.split('-').reverse().join('/')} • ${r.time}</p><span class="badge ${r.status==='Aprovado'?'ok':'warn'}">${esc(r.status)}</span><div class="actions" style="margin-top:14px"><button class="btn" onclick="alterBooking(${r.id})">Alterar</button><button class="btn danger" onclick="cancelBooking(${r.id})">Cancelar</button></div>`:'<div class="empty">Você ainda não possui agendamentos.</div>'}</div>`}
function alterBooking(id){let r=db.requests.find(x=>x.id===id);if(!r)return;let d=prompt('Nova data:',r.date),t=prompt('Novo horário:',r.time);if(d)r.date=d;if(t)r.time=t;r.status='Alteração solicitada';save();render()}
function cancelBooking(id){let r=db.requests.find(x=>x.id===id);if(r){r.status='Cancelado';save();render()}}
function clientDocuments(){let c=db.clients[0];return `<div class="page-head"><div><h1>Documentos</h1><p>Leia a avaliação e dê seu acordo digital no teste.</p></div></div><div class="list">${c.docs.length?c.docs.map(d=>`<div class="card"><h2>${esc(d.title)}</h2><p class="muted">Enviado em ${dtime(d.sentAt)}</p><div class="item"><b>Parecer profissional</b><p>${esc(d.anam.opinion)}</p><b>Riscos / contraindicações</b><p>${esc(d.anam.risks||'Não informado')}</p>${d.anam.photos?.length?`<div class="photo-grid">${d.anam.photos.map(p=>`<img src="${p}" alt="Foto">`).join('')}</div>`:''}<div class="section-gap"><b>Termo de responsabilidade</b><p style="white-space:pre-line">${esc(d.term)}</p></div></div>${d.acceptedAt?`<div class="success section-gap">Acordo registrado em ${dtime(d.acceptedAt)}.</div>`:`<div class="notice section-gap">Leia todo o conteúdo antes de registrar seu acordo.</div><label style="display:flex;gap:9px;align-items:flex-start;margin-top:14px"><input id="agree_${d.id}" type="checkbox"> <span>Li as informações, os riscos e o termo de responsabilidade e estou de acordo.</span></label><button class="btn primary section-gap" onclick="acceptDoc(${d.id})">Dar meu acordo</button>`}</div>`).join(''):'<div class="card empty">Nenhum documento enviado pelo profissional.</div>'}</div>`}
function acceptDoc(id){let d=db.clients[0].docs.find(x=>x.id===id);let cb=document.getElementById('agree_'+id);if(!cb?.checked){toast('Marque a confirmação de leitura antes de continuar.');return}d.acceptedAt=new Date().toISOString();save();toast('Acordo registrado no teste.');render()}
function clientPayments(){let c=db.clients[0],rows=db.receivables.filter(x=>x.clientId===c.id);return `<div class="page-head"><div><h1>Pagamentos</h1><p>Você vê somente o valor final e o status do pagamento.</p></div></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Parcela</th><th>Vencimento</th><th>Valor</th><th>Pagamento</th><th>Status</th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td>${x.installment}/${x.totalInstallments}</td><td>${dt(x.due)}</td><td>${fmt(x.amount)}</td><td>${esc(x.method)}</td><td><span class="badge ${x.status==='Recebido'?'ok':'warn'}">${esc(x.status)}</span></td></tr>`).join(''):`<tr><td colspan="5" class="empty">Nenhuma parcela cadastrada.</td></tr>`}</tbody></table></div></div>`}
function toast(t){let x=document.createElement('div');x.textContent=t;Object.assign(x.style,{position:'fixed',left:'50%',bottom:'86px',transform:'translateX(-50%)',zIndex:200,background:'#242321',color:'#fff',padding:'12px 17px',borderRadius:'13px',boxShadow:'0 8px 30px rgba(0,0,0,.2)',maxWidth:'90%',textAlign:'center'});document.body.appendChild(x);setTimeout(()=>x.remove(),2600)}
function render(){document.getElementById('root').innerHTML=app.role==='pro'?pro():client()}
function safeRender(){try{render()}catch(e){console.error(e);document.getElementById('root').innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:28px;background:#f4f2ee;font-family:Arial"><div style="background:#fff;padding:24px;border-radius:20px"><h2>ED & DU</h2><p>Ocorreu um erro ao carregar o teste.</p></div></div>'}}
safeRender();
</script>
<noscript><div style="padding:24px;font-family:Arial,sans-serif">Ative o JavaScript para utilizar o teste ED & DU.</div></noscript>
</body>
</html>

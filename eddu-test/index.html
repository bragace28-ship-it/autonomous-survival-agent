<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#242321">
<title>ED & DU | Terapia da Beleza</title>
<style>html,body{margin:0;width:100%;height:100%;background:#f4f2ee}#app{width:100%;height:100%;display:grid;place-items:center}#status{font:14px/1.5 Arial,sans-serif;color:#77736c;text-align:center;padding:24px}#status b{display:block;color:#242321;font-size:18px;margin-bottom:8px}</style>
</head>
<body>
<div id="app"><div id="status"><b>ED & DU</b>Carregando o sistema…</div></div>
<script>
(async function(){
  const base='https://raw.githubusercontent.com/bragace28-ship-it/autonomous-survival-agent/main/eddu-test/';
  const parts=['ch0.html','ch1.html','ch2.html','ch3.html','ch4.html','ch5.html','ch6.html','ch7.html','ch8.html'];
  const status=document.getElementById('status');
  try{
    const responses=await Promise.all(parts.map(function(p){return fetch(base+p+'?v=20260912',{cache:'no-store'});}));
    if(responses.some(function(r){return !r.ok;})) throw new Error('Falha ao carregar módulos');
    let html=(await Promise.all(responses.map(function(r){return r.text();}))).join('');
    // Protege qualquer fechamento de script existente dentro do código concatenado.
    const tag='<'+'/script>';
    const pos=html.lastIndexOf(tag);
    if(pos>=0){
      const before=html.slice(0,pos).replace(new RegExp('<'+'/script>','gi'),'<\\/script>');
      html=before+tag+html.slice(pos+tag.length);
    }
    // document.write permite que os scripts do aplicativo sejam executados normalmente;
    // evita depender de iframe/blob, que pode ser bloqueado por WebView/CSP.
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error('EDDU loader:',e);
    document.getElementById('app').innerHTML='<div id="status"><b>ED & DU</b>Não foi possível carregar o sistema.<br><small>Atualize a página para tentar novamente.</small></div>';
  }
})();
</script>
</body>
</html>

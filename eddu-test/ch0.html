<style>
:root{
 --bg:#f4f2ee;--surface:#fff;--surface2:#f8f6f2;--ink:#242321;--muted:#77736c;

}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

.brand{display:flex;align-items:center;gap:12px}.brandmark{width:42px;height:42px;border-radius:13px;background:#242321;color:#fff;display:grid;place-items:center;font-weight:800;letter-spacing:-1px}.brandtext b{display:block;font-size:16px;letter-spacing:.8px}.brandtext span{display:block;color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase}

.layout{display:flex;min-height:calc(100vh - 76px)}.sidebar{width:238px;background:#fff;border-right:1px solid var(--line);padding:18px 13px;position:sticky;top:76px;height:calc(100vh - 76px);display:flex;flex-direction:column}.side-title{padding:5px 12px 10px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1.4px}.nav{border:0;background:transparent;text-align:left;padding:12px 13px;border-radius:11px;margin:2px 0;width:100%;color:#4d4943}.nav:hover,.nav.active{background:#f1eee9;color:#222}.nav.active{font-weight:700}.side-bottom{margin-top:auto;padding:12px}.online{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;background:#4d8a64;border-radius:50%}
main{flex:1;min-width:0}.content{max-width:1320px;margin:auto;padding:30px 28px 100px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px}.page-head h1{margin:0;font-size:30px;letter-spacing:-.7px}.page-head p{margin:5px 0 0;color:var(--muted)}

.btn{border:0;border-radius:11px;padding:10px 14px;background:#eeeae4;color:#282622;transition:.15s}.btn:hover{transform:translateY(-1px)}.btn.primary{background:#242321;color:#fff}.btn.outline{background:#fff;border:1px solid var(--line)}.btn.ok{background:var(--okbg);color:#356448}.btn.warn{background:var(--warnbg);color:#705723}.btn.danger{background:var(--dangerbg);color:#7e3737}.actions{display:flex;flex-wrap:wrap;gap:8px}.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:12px;background:#eeeae4;color:#5d5952}.badge.ok{background:var(--okbg);color:#356448}.badge.warn{background:var(--warnbg);color:#705723}.badge.danger{background:var(--dangerbg);color:#7e3737}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}tr:last-child td{border-bottom:0}

.bar{height:11px;border-radius:999px;background:#eeeae4;overflow:hidden}.bar i{display:block;height:100%;background:#8d8173;border-radius:999px}.bars p{display:flex;justify-content:space-between;margin:12px 0 6px}.bars p span:last-child{font-weight:700}

.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow)}.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:22px}.login-logo .brandmark{width:52px;height:52px}.demo-role{display:grid;grid-template-columns:1fr 1fr;gap:10px}.demo-role .btn{padding:15px}
.bottom-nav{display:none}

@media(max-width:1000px){.sidebar{width:205px}.grid4{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}.quick{grid-template-columns:1fr 1fr}}
@media(max-width:760px){

 .layout{display:block}.sidebar{display:none}.content{padding:20px 15px 95px}.page-head{align-items:flex-start}.page-head h1{font-size:25px}.grid2,.grid3,.grid4{grid-template-columns:1fr}.service-grid{grid-template-columns:1fr 1fr}.quick{grid-template-columns:1fr 1fr}
 .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;height:66px;background:rgba(255,255,255,.97);border-top:1px solid var(--line);z-index:50;padding-bottom:env(safe-area-inset-bottom);overflow:auto}.bottom-nav button{border:0;background:transparent;min-width:82px;flex:1;color:#555;padding:8px 4px;font-size:11px}.bottom-nav button.active{font-weight:800;color:#222}.bottom-nav span{display:block;font-size:18px;line-height:22px}
 .order-line{grid-template-columns:1fr 1fr}.order-line>*:last-child{grid-column:1/-1}.hero{align-items:flex-start}.points{min-width:105px}.two{grid-template-columns:1fr}
 table{min-width:680px}.table-scroll{overflow:auto}
}
@media(max-width:460px){.service-grid{grid-template-columns:1fr}.hero{display:block}.points{text-align:left;margin-top:18px}.role button{padding:8px 8px}.brandtext span{display:none}}

.v10-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}

.v10-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.v10-doc{border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;background:#fbfaf8}
.v10-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.v10-alert{padding:13px;border-radius:12px;background:#f7eee2;border:1px solid #e7d7bd}

.v10-mini{font-size:12px;color:#777}
.v10-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media(max-width:800px){.v10-kpis{grid-template-columns:repeat(2,1fr)}.v10-tabs{overflow:auto;flex-wrap:nowrap}.v10-tabs .btn{white-space:nowrap}}

</style>

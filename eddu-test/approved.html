<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#242321">
<title>ED & DU | Terapia da Beleza</title>
<style>html,body{margin:0;width:100%;height:100%;background:#f4f2ee}#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f2ee}</style>
</head>
<body>
<iframe id="frame" title="ED & DU | Terapia da Beleza"></iframe>
<script>
(async function(){
  const frame=document.getElementById('frame');
  try{
    const base='/eddu-test/ch';
    const parts=[];
    for(let i=0;i<9;i++){
      const r=await fetch(base+i+'.html?v=20260913.4',{cache:'no-store'});
      if(!r.ok) throw new Error('Falha ao carregar bloco '+i+' ('+r.status+')');
      parts.push(await r.text());
    }
    const html=parts.join('');
    if(html.indexOf('<!doctype html')<0 && html.indexOf('<html')<0) throw new Error('Aplicação aprovada inválida');
    const doc=frame.contentWindow.document;
    doc.open();
    doc.write(html);
    doc.close();
  }catch(e){
    document.body.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;font:15px system-ui;background:#f4f2ee;color:#242321"><div style="max-width:620px;background:#fff;border:1px solid #e6e1d9;border-radius:20px;padding:24px"><b>ED & DU | Terapia da Beleza</b><h2>Falha ao carregar a versão aprovada</h2><p>'+String(e.message||e)+'</p><p>Atualize esta página uma vez.</p></div></div>';
    console.error(e);
  }
})();
</script>
</body>
</html>

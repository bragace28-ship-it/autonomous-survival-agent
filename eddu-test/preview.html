<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#242321"><title>ED & DU | Terapia da Beleza</title><style>:root{--bg:#f4f2ee;--card:#fff;--ink:#242321;--muted:#77736c;--line:#e6e1d9;--soft:#eeeae4;--ok:#e5f1e9;--warn:#f4ecd9;--danger:#f6e3e3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:13px;background:#242321;color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}.brand b{display:block;font-size:16px}.brand small{color:var(--muted)}.switch{background:var(--soft);padding:4px;border-radius:12px;display:flex;gap:3px}.switch button,.nav button,.btn{border:0;border-radius:11px;padding:10px 14px;background:var(--soft);color:var(--ink);font:inherit}.switch button.on,.btn.primary,.nav button.on{background:#242321;color:#fff}.shell{max-width:1180px;margin:auto;padding:24px 18px 90px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.title{display:flex;justify-content:space-between;gap:15px;align-items:flex-end;margin-bottom:18px}.title h1{margin:0;font-size:28px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:19px;margin-bottom:14px;box-shadow:0 8px 25px #231e1908}.metric small{color:var(--muted)}.metric strong{display:block;font-size:28px;margin-top:6px}.actions{display:flex;gap:8px;flex-wrap:wrap}.table{overflow:auto}.table table{width:100%;min-width:650px;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line)}.table th{font-size:11px;text-transform:uppercase;color:var(--muted)}.badge{display:inline-block;border-radius:999px;padding:5px 9px;background:var(--soft);font-size:12px}.ok{background:var(--ok)}.warn{background:var(--warn)}.danger{background:var(--danger)}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit}label{display:block;font-size:12px;font-weight:700;color:#5c5750;margin:0 0 5px}.field{margin-bottom:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.servicegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.service{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;cursor:pointer}.service.sel{outline:2px solid #242321}.service b{display:block}.service small{color:var(--muted)}.hero{background:#242321;color:#fff;border-radius:20px;padding:24px;margin-bottom:15px}.hero h1{margin:4px 0}.points{font-size:28px;font-weight:800}.modalbg{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modalbg.show{display:flex}.modal{background:#fff;border-radius:20px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.bottom{display:none}.toast{position:fixed;right:16px;bottom:80px;background:#242321;color:#fff;padding:12px 15px;border-radius:12px;display:none;z-index:30}.toast.show{display:block}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.servicegrid{grid-template-columns:1fr 1fr}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;height:64px;background:#fff;border-top:1px solid var(--line);z-index:10}.bottom button{flex:1;border:0;background:#fff;font:11px system-ui}.bottom span{display:block;font-size:18px}.shell{padding:18px 13px 85px}.title h1{font-size:24px}}@media(max-width:460px){.grid{grid-template-columns:1fr}.servicegrid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.brand small{display:none}.switch button{padding:8px 9px}}</style></head><body><header class="top"><div class="brand"><div class="logo">E</div><div><b>ED & DU</b><small>Terapia da Beleza</small></div></div><div class="switch"><button id="proBtn" class="on" onclick="setRole('pro')">Profissional</button><button id="cliBtn" onclick="setRole('cli')">Cliente</button></div></header><main id="app"></main><div id="modalbg" class="modalbg"></div><div id="toast" class="toast"></div><script>const services=[['Corte Feminino',110,140,49],['Corte Masculino',89,89,31],['Corte + Secagem',136,166,56],['Escova Efeito Liso',99,130,46],['Escova com Text.',112,140,53],['Lava e seca',89,99,29],['Bio Nutrição',89,99,41],['Bio Reconstrução',149,179,50],['Coloração Avulso',189,289,110],['Selagem 3D',229,329,180],['Escova progressiva',289,389,180],['Alisamento',259,359,180],['Combo Mechas Dia',729,849,315],['Combo Master',1599,1999,802],['Combo Coloração',249,349,170],['Combo Terapia',599,799,197]];let role='pro',page='dash',clients=[{id:1,name:'Mariana Silva',phone:'(11) 99999-0000',email:'mariana@email.com',history:[],docs:[],points:180}],requests=[{id:1,client:'Mariana Silva',service:'Corte Feminino',prof:'Ana',date:'2026-09-15',time:'14:00',status:'Pendente'}],payables=[],receivables=[],booking={service:0,prof:'',date:'',time:''},command={service:1,discount:0};const money=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const svc=i=>services[i];function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2500)}function setRole(r){role=r;page=r==='pro'?'dash':'home';document.getElementById('proBtn').classList.toggle('on',r==='pro');document.getElementById('cliBtn').classList.toggle('on',r==='cli');render()}function nav(p){page=p;render()}function navPro(){return `<nav class="nav"><button class="${page==='dash'?'on':''}" onclick="nav('dash')">Dashboard</button><button class="${page==='req'?'on':''}" onclick="nav('req')">Solicitações</button><button class="${page==='agenda'?'on':''}" onclick="nav('agenda')">Agenda</button><button class="${page==='clients'?'on':''}" onclick="nav('clients')">Clientes</button><button class="${page==='orders'?'on':''}" onclick="nav('orders')">Comandas</button><button class="${page==='finance'?'on':''}" onclick="nav('finance')">Financeiro</button></nav>`}function pro(){let body='';if(page==='dash')body=`<div class="title"><div><h1>Dashboard</h1><p class="muted">Visão geral do salão</p></div></div><div class="grid"><div class="card metric"><small>Faturamento</small><strong>${money(82500)}</strong></div><div class="card metric"><small>Custos</small><strong>${money(38200)}</strong></div><div class="card metric"><small>Lucro</small><strong>${money(44300)}</strong></div><div class="card metric"><small>Ticket médio</small><strong>${money(286)}</strong></div></div><div class="grid2"><div class="card"><h2>Próximos atendimentos</h2><div class="table"><table><tr><th>Cliente</th><th>Serviço</th><th>Data</th><th>Status</th></tr>${requests.map(r=>`<tr><td>${r.client}</td><td>${r.service}</td><td>${r.date.split('-').reverse().join('/')} ${r.time}</td><td><span class="badge warn">${r.status}</span></td></tr>`).join('')}</table></div></div><div class="card"><h2>Atalhos</h2><div class="actions"><button class="btn primary" onclick="nav('orders')">Abrir Comandas</button><button class="btn" onclick="nav('agenda')">Abrir Agenda</button><button class="btn" onclick="newClient()">Novo cliente</button></div></div></div>`;else if(page==='req')body=`<div class="title"><div><h1>Solicitações</h1><p class="muted">Aprove, altere ou reagende.</p></div></div><div class="card table"><table><tr><th>Cliente</th><th>Serviço</th><th>Profissional</th><th>Data</th><th>Status</th><th>Ações</th></tr>${requests.map(r=>`<tr><td>${r.client}</td><td>${r.service}</td><td>${r.prof}</td><td>${r.date} ${r.time}</td><td><span class="badge ${r.status==='Aprovado'?'ok':'warn'}">${r.status}</span></td><td><div class="actions"><button class="btn ok" onclick="approve(${r.id})">Aprovar</button><button class="btn" onclick="toast('Reagendamento aberto')">Reagendar</button><button class="btn primary" onclick="toast('Atendimento iniciado')">Iniciar</button></div></td></tr>`).join('')}</table></div>`;else if(page==='agenda')body=`<div class="title"><div><h1>Agenda</h1><p class="muted">Atendimentos e comandos</p></div></div><div class="card"><h2>15/09/2026</h2><div class="card"><b>14:00 • Mariana Silva</b><p class="muted">Corte Feminino • Ana</p><div class="actions"><button class="btn primary" onclick="openCommand()">Abrir comando</button><button class="btn" onclick="toast('Edição do agendamento aberta')">Editar</button><button class="btn" onclick="toast('Comando fechado')">Fechar comando</button></div></div></div>`;else if(page==='clients')body=`<div class="title"><div><h1>Clientes</h1><p class="muted">Cadastro, anamnese e documentos.</p></div><button class="btn primary" onclick="newClient()">Novo cliente</button></div><div class="card table"><table><tr><th>Cliente</th><th>Telefone</th><th>Histórico</th><th>Ações</th></tr>${clients.map(c=>`<tr><td><b>${c.name}</b></td><td>${c.phone}</td><td>${c.history.length} registros</td><td><div class="actions"><button class="btn" onclick="clientFile(${c.id})">Abrir ficha</button><button class="btn" onclick="toast('WhatsApp aberto para teste')">WhatsApp</button></div></td></tr>`).join('')}</table></div>`;else if(page==='orders')body=`<div class="title"><div><h1>Comandas</h1><p class="muted">Valores, custo, comissão e lucro.</p></div></div><div class="card"><h2>Nova comanda</h2><div class="field"><label>Serviço</label><select id="cmdsvc">${services.map((s,i)=>`<option value="${i}">${s[0]} — ${money(s[1])}</option>`).join('')}</select></div><div class="two"><div class="field"><label>Desconto</label><input id="disc" type="number" value="0"></div><div class="field"><label>Forma de pagamento</label><select><option>Pix</option><option>Cartão</option><option>Boleto</option></select></div></div><button class="btn primary" onclick="closeCommand()">Fechar comando</button></div>`;else if(page==='finance')body=finance();document.getElementById('app').innerHTML=`<div class="shell">${navPro()}${body}</div><div class="bottom"><button onclick="nav('dash')">⌂<span>Início</span></button><button onclick="nav('agenda')">◷<span>Agenda</span></button><button onclick="nav('orders')">▣<span>Comandas</span></button><button onclick="nav('clients')">♟<span>Clientes</span></button></div>`}function finance(){let due=payables.reduce((a,x)=>a+x.value,0),rec=receivables.reduce((a,x)=>a+x.value,0);return `<div class="title"><div><h1>Financeiro</h1><p class="muted">Contas a pagar, receber e resultados.</p></div></div><div class="grid"><div class="card metric"><small>A pagar</small><strong>${money(due)}</strong></div><div class="card metric"><small>A receber</small><strong>${money(rec)}</strong></div><div class="card metric"><small>Margem</small><strong>53,7%</strong></div><div class="card metric"><small>Comissões</small><strong>${money(13200)}</strong></div></div><div class="grid2"><div class="card"><h2>Contas a pagar</h2><div class="field"><label>Descrição</label><input id="pd" placeholder="Compra de produtos"></div><div class="two"><input id="pv" type="number" placeholder="Valor"><input id="pdate" type="date"></div><br><button class="btn primary" onclick="addPayable()">Adicionar conta</button>${payables.length?`<div class="table"><table><tr><th>Descrição</th><th>Vencimento</th><th>Valor</th></tr>${payables.map(x=>`<tr><td>${x.desc}</td><td>${x.date}</td><td>${money(x.value)}</td></tr>`).join('')}</table></div>`:''}</div><div class="card"><h2>Contas a receber</h2><p class="muted">Parcelamento interno pelo fechamento da comanda.</p>${receivables.length?receivables.map(x=>`<p><b>${x.client}</b><br>${x.installment} • ${money(x.value)} • ${x.method}</p>`).join(''):'<p class="muted">Nenhum recebível criado.</p>'}</div></div>`}function approve(id){let r=requests.find(x=>x.id===id);r.status='Aprovado';toast('Solicitação aprovada');render()}function newClient(){show('Novo cliente',`<div class="field"><label>Nome</label><input id="cn"></div><div class="two"><div class="field"><label>Telefone</label><input id="cp"></div><div class="field"><label>E-mail</label><input id="ce"></div></div><button class="btn primary" onclick="saveClient()">Salvar cliente</button>`)}function saveClient(){let c={id:Date.now(),name:document.getElementById('cn').value||'Novo Cliente',phone:document.getElementById('cp').value||'',email:document.getElementById('ce').value||'',history:[],docs:[],points:0};clients.push(c);close();toast('Cliente cadastrado');render()}function clientFile(id){let c=clients.find(x=>x.id===id);show('Ficha de '+c.name,`<h3>Dados do cliente</h3><p>${c.phone} • ${c.email}</p><hr><h3>Anamnese</h3><div class="field"><label>Procedimento</label><input id="ap" placeholder="Ex.: Coloração"></div><div class="field"><label>Parecer profissional</label><textarea id="ao" placeholder="Observações técnicas"></textarea></div><div class="field"><label>Riscos / contraindicações</label><textarea id="ar"></textarea></div><div class="field"><label>Fotos da anamnese</label><input id="af" type="file" accept="image/*" multiple></div><button class="btn primary" onclick="saveAnam(${id})">Salvar e enviar para cliente</button><hr><p><b>Histórico:</b> ${c.history.length} registro(s)</p>`)}function saveAnam(id){let c=clients.find(x=>x.id===id);c.history.push({date:new Date().toLocaleString('pt-BR'),procedure:document.getElementById('ap').value,opinion:document.getElementById('ao').value,risks:document.getElementById('ar').value});c.docs.push({title:'Anamnese + Termo de Responsabilidade',accepted:false});close();toast('Anamnese enviada para revisão do cliente');render()}function openCommand(){show('Fechar comando',`<p>Cliente: <b>Mariana Silva</b></p><p>Serviço: <b>Corte Feminino</b></p><div class="summary"><p>Valor: ${money(110)}</p><p>Custo profissional: ${money(49)}</p><p>Comissão 30%: ${money(33)}</p><p><b>Lucro: ${money(28)}</b></p></div><div class="actions"><button class="btn primary" onclick="finishSale()">Enviar para pagamento</button><button class="btn" onclick="installment()">Parcelamento salão</button></div>`)}function closeCommand(){let i=+document.getElementById('cmdsvc').value,d=+document.getElementById('disc').value||0,s=svc(i),net=s[1]-d,com=net*.3,profit=net-s[3]-com;show('Comanda fechada',`<div class="summary"><p>Valor final: ${money(net)}</p><p>Custo: ${money(s[3])}</p><p>Comissão 30%: ${money(com)}</p><p><b>Lucro: ${money(profit)}</b></p></div><br><div class="actions"><button class="btn primary" onclick="finishSale()">Enviar para pagamento</button><button class="btn" onclick="installment()">Parcelamento salão</button></div>`)}function finishSale(){close();toast('Comanda enviada para pagamento');}function installment(){show('Parcelamento salão',`<div class="two"><div class="field"><label>Parcelas</label><select id="ni"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>10</option><option>12</option></select></div><div class="field"><label>Juros %</label><input id="ju" type="number" value="0"></div></div><div class="field"><label>Forma</label><select id="me"><option>Pix</option><option>Boleto</option></select></div><button class="btn primary" onclick="makeInstallment()">Gerar parcelas</button>`)}function makeInstallment(){let n=+document.getElementById('ni').value;for(let i=1;i<=n;i++)receivables.push({client:'Mariana Silva',installment:i+'/'+n,value:110/n,method:document.getElementById('me').value});close();toast('Parcelamento criado com vencimentos');render()}function addPayable(){let d=document.getElementById('pd').value||'Despesa do salão',v=+document.getElementById('pv').value||0,date=document.getElementById('pdate').value||new Date().toISOString().slice(0,10);payables.push({desc:d,value:v,date});toast('Conta a pagar adicionada');render()}function show(title,body){document.getElementById('modalbg').innerHTML=`<div class="modal"><div class="modalhead"><h2>${title}</h2><button class="btn" onclick="close()">✕</button></div>${body}</div>`;document.getElementById('modalbg').classList.add('show')}function close(){document.getElementById('modalbg').classList.remove('show')}function client(){if(page==='home')return `<div class="shell"><div class="hero"><div><small>Olá, Mariana</small><h1>Bem-vinda à ED & DU</h1><p>Seu cuidado começa aqui.</p></div><div><small>Pontos de fidelidade</small><div class="points">180 pts</div></div></div><nav class="nav"><button class="on" onclick="nav('home')">Início</button><button onclick="nav('book')">Agendar</button><button onclick="nav('docs')">Documentos</button><button onclick="nav('pay')">Pagamentos</button></nav><div class="grid"><div class="card"><small>Próximo agendamento</small><h2>15/09 às 14:00</h2><p class="muted">Corte Feminino • Ana</p><button class="btn" onclick="nav('book')">Alterar</button></div><div class="card"><small>Status</small><h2>Pendente</h2><p class="muted">Acompanhe sua solicitação.</p></div></div></div>`;if(page==='book')return `<div class="shell"><div class="title"><div><h1>Agendar atendimento</h1><p class="muted">1 Serviço → 2 Profissional → 3 Data → 4 Hora → 5 Confirmar</p></div></div><div class="card"><h2>1. Serviço</h2><div class="servicegrid">${services.map((s,i)=>`<div class="service ${booking.service===i?'sel':''}" onclick="booking.service=${i};render()"><b>${s[0]}</b><small>Base ${money(s[1])} • Longo ${money(s[2])}</small></div>`).join('')}</div><br><h2>2. Profissional</h2><div class="actions">${['Ana','Eduardo','Marina'].map(p=>`<button class="btn ${booking.prof===p?'primary':''}" onclick="booking.prof='${p}';render()">${p}</button>`).join('')}</div><br><div class="two"><div class="field"><label>3. Data</label><input type="date" onchange="booking.date=this.value" value="${booking.date}"></div><div class="field"><label>4. Hora</label><select onchange="booking.time=this.value"><option value="">Selecione</option>${['09:00','10:30','14:00','16:00','16:30','18:00'].map(t=>`<option ${booking.time===t?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="card"><h3>5. Confirmar</h3><p>${booking.service!==null&&booking.service!==undefined?svc(booking.service)[0]:'Escolha o serviço'} • ${booking.prof||'Escolha o profissional'} • ${booking.date||'Escolha a data'} • ${booking.time||'Escolha a hora'}</p><button class="btn primary" onclick="sendBooking()">Enviar solicitação</button></div></div></div>`;if(page==='docs')return `<div class="shell"><div class="title"><div><h1>Documentos</h1><p class="muted">Anamnese e termo de responsabilidade.</p></div></div><div class="card"><h2>Anamnese + Termo de Responsabilidade</h2><p>Leia as informações fornecidas pelo profissional antes do procedimento.</p><p class="muted">Riscos e contraindicações serão apresentados aqui junto às fotos anexadas.</p><label><input id="agree" type="checkbox" style="width:auto"> Li e estou de acordo.</label><br><button class="btn primary" onclick="accept()">Dar meu acordo</button></div></div>`;return `<div class="shell"><div class="title"><div><h1>Pagamentos</h1><p class="muted">Veja apenas o valor final da sua comanda.</p></div></div><div class="card"><h2>Comanda</h2><p>Corte Feminino</p><h1>${money(110)}</h1><span class="badge warn">Aguardando pagamento</span><br><br><button class="btn primary" onclick="toast('Pagamento Pix selecionado')">Pagar com Pix</button></div></div>`}function sendBooking(){if(booking.prof&&booking.date&&booking.time){requests.unshift({id:Date.now(),client:'Mariana Silva',service:svc(booking.service)[0],prof:booking.prof,date:booking.date,time:booking.time,status:'Pendente'});toast('Solicitação enviada');nav('home')}else toast('Complete as etapas')}function accept(){if(document.getElementById('agree')?.checked){clients[0].docs[0].accepted=true;toast('Acordo registrado com data e hora')}else toast('Marque a confirmação')}function render(){document.getElementById('app').innerHTML=role==='pro'?pro():client()}render();</script></body></html>

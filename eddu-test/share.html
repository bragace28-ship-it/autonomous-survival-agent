<title>ED & DU | Terapia da Beleza — V13.1</title>
<style>
:root{--bg:#f4f2ee;--surface:#fff;--surface2:#f8f6f2;--ink:#242321;--muted:#77736c;--line:#e6e1d9;--dark:#242321;--accent:#8d8173;--accent2:#d9cfc1;--ok:#3f7657;--okbg:#e5f1e9;--warn:#8b692f;--warnbg:#f4ecd9;--danger:#9b4d4d;--dangerbg:#f6e3e3;--shadow:0 10px 30px rgba(35,30,25,.06);--radius:18px}*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.appbar{height:76px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:14px;font-weight:800;font-size:20px}.brandmark{width:48px;height:48px;border-radius:16px;background:var(--dark);color:white;display:grid;place-items:center;font-size:20px}.switch{background:#ece9e3;border-radius:20px;padding:6px;display:flex;gap:4px}.switch button{border:0;background:transparent;padding:10px 18px;border-radius:15px;color:#4b4843}.switch button.active{background:var(--dark);color:#fff}.shell{display:flex;min-height:calc(100vh - 76px)}.side{width:235px;background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:76px;height:calc(100vh - 76px)}.navbtn{width:100%;border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:12px;margin:2px 0;color:#57534d}.navbtn.active{background:#f0ece6;color:var(--ink);font-weight:700}.main{flex:1;min-width:0;padding:26px;max-width:1500px;margin:auto;width:100%}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.pagehead h1{margin:0;font-size:27px}.muted{color:var(--muted)}.grid{display:grid;gap:16px}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}.metric{min-height:125px}.metric .label{font-size:12px;color:var(--muted)}.metric .value{font-size:28px;font-weight:800;margin-top:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 14px;font-weight:650}.btn.primary{background:var(--dark);color:#fff;border-color:var(--dark)}.btn.danger{background:var(--dangerbg);color:var(--danger);border-color:transparent}.btn.ok{background:var(--okbg);color:var(--ok);border-color:transparent}.actions{display:flex;flex-wrap:wrap;gap:8px}.tablewrap{overflow-x:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left}.table th{font-size:12px;color:var(--muted)}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:700;color:#605b54}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 12px;outline:none}.field textarea{min-height:90px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.span2{grid-column:1/-1}.modal{position:fixed;inset:0;background:rgba(24,21,18,.46);z-index:100;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modalbox{width:min(720px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;box-shadow:0 25px 70px rgba(0,0,0,.18)}.modalhead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:2}.modalhead h3{margin:0}.close{border:0;background:#f2efe9;width:38px;height:38px;border-radius:50%;font-size:22px}.modalbody{padding:20px}.mobileNav{display:none}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700;background:#eee9e1}.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.danger{background:var(--dangerbg);color:var(--danger)}.clientcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.clientcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.clientcard h3{margin:0 0 5px}.clientmeta{color:var(--muted);font-size:13px;display:grid;gap:2px;margin:10px 0 14px}.sectiontitle{font-size:16px;font-weight:800;margin:0 0 12px}.empty{padding:28px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:24px;right:24px;z-index:200;background:var(--dark);color:#fff;padding:12px 16px;border-radius:12px;display:none;max-width:min(360px,calc(100vw - 32px))}.toast.show{display:block}@media(max-width:900px){.side{display:none}.main{padding:18px 14px 92px}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.clientcards{grid-template-columns:1fr}.mobileNav{position:fixed;display:flex;bottom:0;left:0;right:0;height:68px;background:rgba(255,255,255,.97);border-top:1px solid var(--line);z-index:50;justify-content:space-around;padding:7px 5px env(safe-area-inset-bottom)}.mobileNav button{border:0;background:transparent;font-size:11px;color:var(--muted);display:grid;place-items:center;min-width:58px}.mobileNav button.active{color:var(--ink);font-weight:800}.appbar{height:68px;padding:0 12px}.brand{font-size:17px;gap:9px}.brandmark{width:40px;height:40px;border-radius:13px}.switch{padding:4px}.switch button{padding:8px 11px}.pagehead{align-items:flex-start}.pagehead h1{font-size:22px}.formgrid{grid-template-columns:1fr}.modal{padding:10px;align-items:flex-end}.modalbox{max-height:94vh;border-radius:20px 20px 14px 14px}.actions .btn{flex:1;min-width:100px}.table{min-width:650px}.metric .value{font-size:24px}}@media(max-width:420px){.grid4{grid-template-columns:1fr 1fr}.card{padding:14px}.pagehead{gap:10px}.pagehead .btn{padding:9px 10px}.switch button{padding:8px 9px}.appbar{gap:8px}.brandmark{width:38px;height:38px}.brand{font-size:16px}}
</style>

<body><div id="root"></div><script>
'use strict';
const services=[['Corte Fem','Corte Fem',110,140,49],['Corte Masc','Corte Masc',89,89,31],['Corte + Secagem','Corte + Secagem',136,166,56],['Escova Efeito Lis','Escova Efeito Lis',99,130,46],['Escova com Text.','Escova com Text.',112,140,53],['Lava e seca','Lava e seca',89,99,29],['Bio Nutrição','Bio Nutrição',89,99,41],['Bio Reconstrução','Bio Reconstrução',149,179,50],['Coloração Avulso','Coloração Avulso',189,289,110],['Selagem 3d','Selagem 3d',229,329,180],['Escova progressiva','Escova progressiva',289,389,180],['Alisamento','Alisamento',259,359,180],['Combo Mechas Dia','Combo Mechas Dia',729,849,315],['Combo Master','Combo Master',1599,1999,802],['Combo Coloração','Combo Coloração',249,349,170],['Combo Terapia','Combo Terapia',599,799,197]];
let db=JSON.parse(localStorage.getItem('eddu_v13_db')||'null')||{role:'pro',page:'dashboard',clients:[{id:1,name:'Mariana Souza',phone:'11999990001',email:'mariana@email.com',points:120,term:true}],appointments:[{id:1,date:new Date().toISOString().slice(0,10),time:'14:30',client:'Mariana Souza',professional:'ED',service:'Corte Fem',status:'Confirmado',command:1}],commands:[{id:1,client:'Mariana Souza',professional:'ED',items:[{service:'Corte Fem',price:110,cost:49}],discount:0,status:'Aberta',payment:null}],payables:[{id:1,desc:'Produtos profissionais',supplier:'Fornecedor',value:680,due:'2026-09-20',status:'Aberta',method:'Pix',category:'Insumos'}],receivables:[{id:1,client:'Mariana Souza',desc:'Serviço',value:110,due:'2026-09-15',status:'Aberta',method:'Pix'}]};
function save(){localStorage.setItem('eddu_v13_db',JSON.stringify(db))}function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function esc(s){return String(s??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','"':'&quot;'}[c]))}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove('show'),2400)}function closeModal(id){document.getElementById(id)?.remove()}function nav(p){db.page=p;save();render()}function setRole(r){db.role=r;db.page=r==='pro'?'dashboard':'home';save();render()}
function layout(content){return `<header class="appbar"><div class="brand"><div class="brandmark">E</div><span>ED & DU</span></div><div class="switch"><button class="${db.role==='pro'?'active':''}" onclick="setRole('pro')">Profissional</button><button class="${db.role==='client'?'active':''}" onclick="setRole('client')">Cliente</button></div></header><div class="shell"><aside class="side">${db.role==='pro'?proNav():clientNav()}</aside><main class="main">${content}</main></div><nav class="mobileNav">${db.role==='pro'?proMobileNav():clientMobileNav()}</nav><div id="toast" class="toast"></div>`}function proNav(){return ['dashboard:Dashboard','requests:Solicitações','agenda:Agenda','clients:Clientes','commands:Comandas','finance:Gestão de Contas'].map(x=>{let[a,b]=x.split(':');return `<button class="navbtn ${db.page===a?'active':''}" onclick="nav('${a}')">${b}</button>`}).join('')}function clientNav(){return ['home:Início','book:Agendar','documents:Documentos','payments:Pagamentos'].map(x=>{let[a,b]=x.split(':');return `<button class="navbtn ${db.page===a?'active':''}" onclick="nav('${a}')">${b}</button>`}).join('')}function proMobileNav(){return [['dashboard','⌂','Início'],['agenda','◷','Agenda'],['clients','♙','Clientes'],['commands','▣','Comandas'],['finance','R$','Contas']].map(a=>`<button class="${db.page===a[0]?'active':''}" onclick="nav('${a[0]}')"><b>${a[1]}</b><span>${a[2]}</span></button>`).join('')}function clientMobileNav(){return [['home','⌂','Início'],['book','＋','Agendar'],['documents','▤','Docs'],['payments','R$','Pagamentos']].map(a=>`<button class="${db.page===a[0]?'active':''}" onclick="nav('${a[0]}')"><b>${a[1]}</b><span>${a[2]}</span></button>`).join('')}
function dashboard(){return `<div class="pagehead"><div><h1>Visão geral</h1><div class="muted">Gestão do salão</div></div><button class="btn primary" onclick="newCommand()">+ Nova comanda</button></div><div class="grid grid4"><div class="card metric"><div class="label">Faturamento recebido</div><div class="value">${money(db.commands.filter(c=>c.status==='Paga').reduce((s,c)=>s+calc(c).total,0))}</div></div><div class="card metric"><div class="label">Contas a pagar</div><div class="value">${db.payables.filter(x=>x.status!=='Paga').length}</div></div><div class="card metric"><div class="label">Clientes</div><div class="value">${db.clients.length}</div></div><div class="card metric"><div class="label">Comandas abertas</div><div class="value">${db.commands.filter(c=>c.status!=='Paga').length}</div></div></div><div class="grid grid2" style="margin-top:16px"><div class="card"><h2 class="sectiontitle">Próximos atendimentos</h2>${db.appointments.slice(0,5).map(a=>`<div style="padding:11px 0;border-bottom:1px solid var(--line)"><b>${esc(a.time)} · ${esc(a.client)}</b><div class="muted">${esc(a.service)}</div></div>`).join('')||'<div class="empty">Nenhum atendimento.</div>'}</div><div class="card"><h2 class="sectiontitle">Resumo financeiro</h2><div class="actions"><button class="btn" onclick="nav('finance')">Gestão de contas</button><button class="btn" onclick="nav('commands')">Comandas</button></div></div></div>`}
function requests(){return `<div class="pagehead"><h1>Solicitações</h1></div><div class="grid grid2">${db.appointments.filter(a=>a.status==='Pendente').map(a=>`<div class="card"><b>${esc(a.client)}</b><p class="muted">${esc(a.date)} · ${esc(a.time)} · ${esc(a.service)}</p><div class="actions"><button class="btn ok" onclick="approveAppt(${a.id})">Aprovar</button><button class="btn" onclick="editAppt(${a.id})">Reagendar</button><button class="btn danger" onclick="cancelAppt(${a.id})">Recusar</button></div></div>`).join('')||'<div class="card empty">Nenhuma solicitação pendente.</div>'}</div>`}
function agenda(){return `<div class="pagehead"><div><h1>Agenda</h1><div class="muted">Atendimentos e comandas.</div></div><button class="btn primary" onclick="newAppt()">+ Agendamento</button></div><div class="grid">${db.appointments.map(a=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><div><b>${esc(a.date)} · ${esc(a.time)}</b><h3 style="margin:5px 0">${esc(a.client)}</h3><div class="muted">${esc(a.service)} · ${esc(a.professional)}</div></div><span class="pill ${a.status==='Cancelado'?'danger':a.status==='Pendente'?'warn':'ok'}">${esc(a.status)}</span></div><div class="actions" style="margin-top:14px"><button class="btn" onclick="openCommand(${a.command||0})">Abrir comanda</button><button class="btn" onclick="editAppt(${a.id})">Editar</button><button class="btn danger" onclick="cancelAppt(${a.id})">Cancelar</button></div></div>`).join('')}</div>`}
function clients(){return `<div class="pagehead"><div><h1>Clientes</h1><div class="muted">Fichas e relacionamento.</div></div><button class="btn primary" onclick="newClient()">+ Novo cliente</button></div><div class="clientcards">${db.clients.map(c=>`<article class="clientcard"><h3>${esc(c.name)}</h3><div class="clientmeta"><span>☎ ${esc(c.phone||'—')}</span><span>✉ ${esc(c.email||'—')}</span><span>${c.points||0} pontos</span></div><div class="actions"><button class="btn" onclick="editClient(${c.id})">Editar</button><button class="btn" onclick="openClient(${c.id})">Abrir ficha</button><button class="btn" onclick="whats('${esc(c.phone||'')}')">WhatsApp</button></div></article>`).join('')}</div>`}
function commands(){return `<div class="pagehead"><div><h1>Comandas</h1><div class="muted">Atendimentos, descontos e pagamentos.</div></div><button class="btn primary" onclick="newCommand()">+ Nova comanda</button></div><div class="grid">${db.commands.map(c=>{let t=calc(c);return `<div class="card"><div style="display:flex;justify-content:space-between;gap:12px"><div><b>${esc(c.client)}</b><div class="muted">${esc(c.professional)}</div></div><span class="pill ${c.status==='Paga'?'ok':'warn'}">${esc(c.status)}</span></div><div style="margin:14px 0">${c.items.map(i=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(i.service)}</span><b>${money(i.price)}</b></div>`).join('')}</div><div class="actions"><button class="btn" onclick="viewCommand(${c.id})">Visualizar comanda</button><button class="btn" onclick="editCommand(${c.id})">Editar comanda</button>${c.status!=='Paga'?`<button class="btn primary" onclick="closeCommand(${c.id})">Fechar comanda</button>`:''}</div><div style="display:flex;justify-content:space-between;margin-top:12px;font-weight:800"><span>Total</span><span>${money(t.total)}</span></div></div>`}).join('')}</div>`}
function calc(c){let sub=c.items.reduce((s,i)=>s+Number(i.price),0),discount=Number(c.discount||0),net=Math.max(0,sub-discount),cost=c.items.reduce((s,i)=>s+Number(i.cost||0),0),commission=net*.3;return{sub,discount,net,cost,commission,profit:net-cost-commission,total:net}}
function finance(){let m=new Date().toISOString().slice(0,7);return `<div class="pagehead"><div><h1>Gestão de Contas</h1><div class="muted">Pagar, receber e vencimentos.</div></div><button class="btn primary" onclick="newAccount()">+ Nova conta</button></div><div class="grid grid4"><div class="card metric"><div class="label">A pagar este mês</div><div class="value">${money(db.payables.filter(x=>x.due?.startsWith(m)&&x.status!=='Paga').reduce((s,x)=>s+Number(x.value),0))}</div></div><div class="card metric"><div class="label">A receber este mês</div><div class="value">${money(db.receivables.filter(x=>x.due?.startsWith(m)&&x.status!=='Recebida').reduce((s,x)=>s+Number(x.value),0))}</div></div><div class="card metric"><div class="label">Em aberto</div><div class="value">${db.payables.filter(x=>x.status!=='Paga').length+db.receivables.filter(x=>x.status!=='Recebida').length}</div></div><div class="card metric"><div class="label">Próximos vencimentos</div><div class="value">${db.payables.length+db.receivables.length}</div></div></div><div class="card" style="margin-top:16px"><div class="actions"><button class="btn" onclick="accountTab('overview')">Visão geral</button><button class="btn" onclick="accountTab('payables')">Contas a pagar</button><button class="btn" onclick="accountTab('receivables')">Contas a receber</button></div><div id="accountArea">${accountArea('overview')}</div></div>`}
function accountArea(t){if(t==='overview')return `<div class="grid grid2" style="margin-top:16px"><div><h2 class="sectiontitle">Vencimentos</h2>${[...db.payables.map(x=>({...x,type:'Pagar'})),...db.receivables.map(x=>({...x,type:'Receber'}))].sort((a,b)=>String(a.due).localeCompare(String(b.due))).slice(0,10).map(x=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${esc(x.due)}</b> · ${x.type}<div>${esc(x.desc||x.supplier||x.client)} — ${money(x.value)}</div></div>`).join('')}</div><div><h2 class="sectiontitle">Status</h2><p>${db.payables.filter(x=>x.status!=='Paga').length} contas a pagar abertas</p><p>${db.receivables.filter(x=>x.status!=='Recebida').length} contas a receber abertas</p><button class="btn" onclick="newAccount()">Lançar conta</button></div></div>`;return accountTable(t==='payables'?db.payables:db.receivables,t==='payables')}
function accountTable(a,pay){return `<div class="tablewrap" style="margin-top:16px"><table class="table"><thead><tr><th>Vencimento</th><th>Descrição</th><th>${pay?'Fornecedor':'Cliente'}</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.due)}</td><td>${esc(x.desc||'')}</td><td>${esc(x.supplier||x.client||'')}</td><td>${money(x.value)}</td><td><span class="pill ${x.status==='Paga'||x.status==='Recebida'?'ok':'warn'}">${esc(x.status)}</span></td><td><div class="actions"><button class="btn" onclick="editAccount(${x.id},${pay})">Editar</button>${x.status==='Aberta'?`<button class="btn ok" onclick="settleAccount(${x.id},${pay})">${pay?'Pagar':'Receber'}</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nenhuma conta.</td></tr>'}</tbody></table></div>`}function accountTab(t){document.getElementById('accountArea').innerHTML=accountArea(t)}
function home(){return `<div class="pagehead"><div><h1>Olá, Mariana 👋</h1><div class="muted">Bem-vinda à ED & DU.</div></div></div><div class="grid grid2"><div class="card metric"><div class="label">Seus pontos</div><div class="value">120</div></div><div class="card"><h2 class="sectiontitle">Próximo atendimento</h2><p>Hoje às 14:30 · Corte Fem</p><button class="btn" onclick="nav('documents')">Ver documentos</button></div></div>`}function book(){return `<div class="pagehead"><h1>Agendar atendimento</h1></div><div class="card"><div class="formgrid"><div class="field"><label>Serviço</label><select id="bservice">${services.map(s=>`<option>${s[1]}</option>`).join('')}</select></div><div class="field"><label>Profissional</label><select id="bpro"><option>ED</option><option>Profissional</option></select></div><div class="field"><label>Data</label><input id="bdate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Horário</label><input id="btime" type="time" value="15:00"></div><div class="span2 actions"><button class="btn primary" onclick="submitBooking()">Confirmar agendamento</button></div></div></div>`}function documents(){return `<div class="pagehead"><h1>Documentos</h1></div><div class="card"><h2 class="sectiontitle">Termo de responsabilidade</h2><p class="muted">Leia e registre seu acordo.</p><label style="display:flex;gap:9px;align-items:center;margin:16px 0"><input id="agree" type="checkbox"> Li e estou de acordo</label><button class="btn primary" onclick="acceptTerm()">Dar meu acordo</button></div>`}function payments(){return `<div class="pagehead"><h1>Pagamentos</h1></div>${db.receivables.map(r=>`<div class="card" style="margin-bottom:12px"><b>${money(r.value)}</b><p class="muted">${esc(r.desc)} · ${esc(r.due)}</p><span class="pill ${r.status==='Recebida'?'ok':'warn'}">${esc(r.status)}</span></div>`).join('')||'<div class="card empty">Nenhum pagamento.</div>'}`}
function modal(id,title,body,actions=''){document.getElementById(id)?.remove();document.body.insertAdjacentHTML('beforeend',`<div class="modal show" id="${id}" onclick="if(event.target===this)closeModal('${id}')"><div class="modalbox"><div class="modalhead"><h3>${title}</h3><button class="close" onclick="closeModal('${id}')">×</button></div><div class="modalbody">${body}</div>${actions?`<div style="padding:16px 20px;border-top:1px solid var(--line)"><div class="actions" style="justify-content:flex-end">${actions}</div></div>`:''}</div></div>`)}
function newClient(){modal('clientModal','Novo cliente',`<div class="formgrid"><div class="field span2"><label>Nome</label><input id="cn"></div><div class="field"><label>Telefone</label><input id="cp"></div><div class="field"><label>E-mail</label><input id="ce" type="email"></div></div>`,`<button class="btn" onclick="closeModal('clientModal')">Cancelar</button><button class="btn primary" onclick="saveClient()">Salvar</button>`)}function saveClient(id){let c={id:id||Date.now(),name:document.getElementById('cn').value.trim(),phone:document.getElementById('cp').value.trim(),email:document.getElementById('ce').value.trim(),points:0,term:false};if(!c.name)return toast('Informe o nome');if(id){let i=db.clients.findIndex(x=>x.id===id);if(i>=0)db.clients[i]={...db.clients[i],...c}}else db.clients.push(c);save();closeModal('clientModal');render();toast('Cliente salvo')}function editClient(id){let c=db.clients.find(x=>x.id===id);modal('clientModal','Editar cliente',`<div class="formgrid"><div class="field span2"><label>Nome</label><input id="cn" value="${esc(c.name)}"></div><div class="field"><label>Telefone</label><input id="cp" value="${esc(c.phone||'')}"></div><div class="field"><label>E-mail</label><input id="ce" value="${esc(c.email||'')}" type="email"></div></div>`,`<button class="btn" onclick="closeModal('clientModal')">Cancelar</button><button class="btn primary" onclick="saveClient(${id})">Salvar alterações</button>`)}function openClient(id){let c=db.clients.find(x=>x.id===id);modal('clientFile','Ficha do cliente',`<h3>${esc(c.name)}</h3><p class="muted">${esc(c.phone||'')} · ${esc(c.email||'')}</p><div class="card"><b>Anamnese</b><p>Histórico e observações.</p><button class="btn" onclick="anamnese(${id})">Nova anamnese</button></div>`)}function anamnese(id){modal('anam','Anamnese',`<div class="formgrid"><div class="field"><label>Data/hora</label><input type="datetime-local"></div><div class="field"><label>Procedimento</label><input></div><div class="field span2"><label>Parecer profissional</label><textarea></textarea></div><div class="field span2"><label>Riscos / contraindicações</label><textarea></textarea></div><div class="field span2"><label>Fotos</label><input type="file" accept="image/*" capture="environment" multiple></div></div>`,`<button class="btn" onclick="closeModal('anam')">Cancelar</button><button class="btn primary" onclick="closeModal('anam');toast('Anamnese registrada')">Salvar</button>`)}function whats(p){if(!p)return toast('Cliente sem telefone');window.open('https://wa.me/55'+String(p).replace(/\D/g,''),'_blank')}
function newCommand(){let opts=db.clients.map(c=>`<option>${esc(c.name)}</option>`).join('');modal('cmdEdit','Nova comanda',`<div class="formgrid"><div class="field"><label>Cliente</label><select id="cc">${opts}</select></div><div class="field"><label>Profissional</label><input id="cprof" value="ED"></div><div class="field span2"><label>Serviço</label><select id="cservice">${services.map(s=>`<option value="${esc(s[1])}">${esc(s[1])} — ${money(s[2])}</option>`).join('')}</select></div><div class="field"><label>Desconto</label><input id="cdisc" type="number" min="0" value="0"></div><div class="field"><label>Motivo</label><input id="creason"></div></div>`,`<button class="btn" onclick="closeModal('cmdEdit')">Cancelar</button><button class="btn primary" onclick="saveNewCommand()">Criar comanda</button>`)}function saveNewCommand(){let s=services.find(x=>x[1]===document.getElementById('cservice').value),c={id:Date.now(),client:document.getElementById('cc').value,professional:document.getElementById('cprof').value,items:[{service:s[1],price:s[2],cost:s[4]}],discount:Number(document.getElementById('cdisc').value||0),discountReason:document.getElementById('creason').value,status:'Aberta'};db.commands.push(c);save();closeModal('cmdEdit');render();toast('Comanda criada')}function viewCommand(id){let c=db.commands.find(x=>x.id===id),t=calc(c);modal('cmdView','Visualizar comanda',`<p><b>${esc(c.client)}</b> · ${esc(c.professional)}</p>${c.items.map(i=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span>${esc(i.service)}</span><b>${money(i.price)}</b></div>`).join('')}<div style="margin-top:14px;display:grid;gap:7px"><div>Subtotal: <b>${money(t.sub)}</b></div><div>Desconto: <b>${money(t.discount)}</b></div><div>Valor final: <b>${money(t.total)}</b></div><div>Custo: <b>${money(t.cost)}</b></div><div>Lucro estimado: <b>${money(t.profit)}</b></div></div>`,`<button class="btn" onclick="closeModal('cmdView')">Fechar</button>${c.status!=='Paga'?`<button class="btn primary" onclick="closeModal('cmdView');closeCommand(${id})">Fechar comanda</button>`:''}`)}function editCommand(id){let c=db.commands.find(x=>x.id===id);modal('cmdEdit','Editar comanda',`<div class="formgrid"><div class="field"><label>Cliente</label><input id="ecclient" value="${esc(c.client)}"></div><div class="field"><label>Profissional</label><input id="ecprof" value="${esc(c.professional)}"></div><div class="field span2"><label>Serviço</label><select id="ecservice">${services.map(s=>`<option ${s[1]===c.items[0]?.service?'selected':''}>${esc(s[1])}</option>`).join('')}</select></div><div class="field"><label>Desconto</label><input id="ecdisc" type="number" value="${c.discount||0}"></div><div class="field"><label>Motivo</label><input id="ecreason" value="${esc(c.discountReason||'')}"></div></div>`,`<button class="btn" onclick="closeModal('cmdEdit')">Cancelar</button><button class="btn primary" onclick="saveEditCommand(${id})">Salvar alterações</button>`)}function saveEditCommand(id){let c=db.commands.find(x=>x.id===id),s=services.find(x=>x[1]===document.getElementById('ecservice').value);c.client=document.getElementById('ecclient').value;c.professional=document.getElementById('ecprof').value;c.items=[{service:s[1],price:s[2],cost:s[4]}];c.discount=Number(document.getElementById('ecdisc').value||0);c.discountReason=document.getElementById('ecreason').value;save();closeModal('cmdEdit');render();toast('Comanda atualizada')}function closeCommand(id){let c=db.commands.find(x=>x.id===id),t=calc(c);modal('payModal','Fechar comanda',`<p>Total: <strong>${money(t.total)}</strong></p><div class="formgrid"><div class="field"><label>Pagamento</label><select id="paymethod"><option>Pix</option><option>Cartão de Crédito</option><option>Cartão de Débito</option><option>Dinheiro</option><option>Boleto</option><option>Parcelamento salão</option></select></div><div class="field"><label>Parcelas</label><select id="install"><option>1</option><option>2</option><option>3</option><option>4</option></select></div></div>`,`<button class="btn" onclick="closeModal('payModal')">Cancelar</button><button class="btn primary" onclick="settleCommand(${id})">Confirmar liquidação</button>`)}function settleCommand(id){let c=db.commands.find(x=>x.id===id);c.status='Paga';c.payment={method:document.getElementById('paymethod').value,install:Number(document.getElementById('install').value),at:new Date().toISOString()};save();closeModal('payModal');render();toast('Comanda liquidada')}
function newAppt(){let opts=db.clients.map(c=>`<option>${esc(c.name)}</option>`).join('');modal('appt','Novo agendamento',`<div class="formgrid"><div class="field"><label>Cliente</label><select id="ac">${opts}</select></div><div class="field"><label>Serviço</label><select id="as">${services.map(s=>`<option>${esc(s[1])}</option>`).join('')}</select></div><div class="field"><label>Data</label><input id="ad" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Horário</label><input id="at" type="time" value="15:00"></div></div>`,`<button class="btn" onclick="closeModal('appt')">Cancelar</button><button class="btn primary" onclick="saveAppt()">Salvar</button>`)}function saveAppt(id){let a={id:id||Date.now(),client:document.getElementById('ac').value,service:document.getElementById('as').value,date:document.getElementById('ad').value,time:document.getElementById('at').value,professional:'ED',status:'Confirmado'};if(id){let i=db.appointments.findIndex(x=>x.id===id);a.command=db.appointments[i]?.command;db.appointments[i]=a}else db.appointments.push(a);save();closeModal('appt');render();toast('Agendamento salvo')}function editAppt(id){let a=db.appointments.find(x=>x.id===id);modal('appt','Editar agendamento',`<div class="formgrid"><div class="field"><label>Cliente</label><input id="ac" value="${esc(a.client)}"></div><div class="field"><label>Serviço</label><input id="as" value="${esc(a.service)}"></div><div class="field"><label>Data</label><input id="ad" type="date" value="${esc(a.date)}"></div><div class="field"><label>Horário</label><input id="at" type="time" value="${esc(a.time)}"></div></div>`,`<button class="btn" onclick="closeModal('appt')">Cancelar</button><button class="btn primary" onclick="saveAppt(${id})">Salvar alterações</button>`)}function cancelAppt(id){let a=db.appointments.find(x=>x.id===id);a.status='Cancelado';save();render();toast('Agendamento cancelado')}function approveAppt(id){let a=db.appointments.find(x=>x.id===id);a.status='Confirmado';save();render();toast('Solicitação aprovada')}function openCommand(id){if(!id)return toast('Sem comanda');viewCommand(id)}
function newAccount(type='payable'){let p=type!=='receivable';modal('account','Nova conta',`<div class="formgrid"><div class="field"><label>Tipo</label><select id="atype"><option value="payable" ${p?'selected':''}>A pagar</option><option value="receivable" ${!p?'selected':''}>A receber</option></select></div><div class="field"><label>Descrição</label><input id="adesc"></div><div class="field"><label>Parte</label><input id="aperson"></div><div class="field"><label>Valor</label><input id="aval" type="number" step="0.01"></div><div class="field"><label>Vencimento</label><input id="adue" type="date"></div><div class="field"><label>Forma</label><select id="amethod"><option>Pix</option><option>Cartão de Crédito</option><option>Cartão de Débito</option><option>Boleto</option><option>Dinheiro</option></select></div><div class="field"><label>Categoria</label><input id="acat"></div><div class="field span2"><label>Comprovante / PDF / foto</label><input id="afile" type="file" accept="image/*,.pdf" capture="environment"></div></div>`,`<button class="btn" onclick="closeModal('account')">Cancelar</button><button class="btn primary" onclick="saveAccount()">Salvar conta</button>`)}function saveAccount(){let p=document.getElementById('atype').value==='payable',x={id:Date.now(),desc:document.getElementById('adesc').value,value:Number(document.getElementById('aval').value||0),due:document.getElementById('adue').value,status:'Aberta',method:document.getElementById('amethod').value,category:document.getElementById('acat').value};if(p)x.supplier=document.getElementById('aperson').value;else x.client=document.getElementById('aperson').value;if(p)db.payables.push(x);else db.receivables.push(x);save();closeModal('account');render();toast('Conta lançada')}function editAccount(id,pay){let x=(pay?db.payables:db.receivables).find(a=>a.id===id);if(!x)return;newAccount(pay?'payable':'receivable');setTimeout(()=>{document.getElementById('adesc').value=x.desc||'';document.getElementById('aperson').value=x.supplier||x.client||'';document.getElementById('aval').value=x.value;document.getElementById('adue').value=x.due;document.getElementById('amethod').value=x.method||'Pix';document.getElementById('acat').value=x.category||''},0)}function settleAccount(id,pay){let x=(pay?db.payables:db.receivables).find(a=>a.id===id);modal('settle','Baixar conta',`<p>Confirmar ${pay?'pagamento':'recebimento'} de <strong>${money(x.value)}</strong>?</p><div class="field"><label>Forma</label><select id="smethod"><option>Cartão de Crédito</option><option>Pix</option><option>Cartão de Débito</option><option>Dinheiro</option><option>Boleto</option></select></div>${pay?`<div class="field" style="margin-top:10px"><label>Fatura do cartão</label><input id="invoice"></div>`:''}`,`<button class="btn" onclick="closeModal('settle')">Cancelar</button><button class="btn primary" onclick="confirmSettle(${id},${pay})">Confirmar baixa</button>`)}function confirmSettle(id,pay){let x=(pay?db.payables:db.receivables).find(a=>a.id===id);x.status=pay?'Paga':'Recebida';x.settleMethod=document.getElementById('smethod').value;if(pay&&x.settleMethod==='Cartão de Crédito')x.cardInvoice=document.getElementById('invoice').value||'Fatura do cartão';save();closeModal('settle');render();toast('Baixa registrada')}function submitBooking(){db.appointments.push({id:Date.now(),client:'Mariana Souza',service:document.getElementById('bservice').value,professional:document.getElementById('bpro').value,date:document.getElementById('bdate').value,time:document.getElementById('btime').value,status:'Pendente'});save();toast('Solicitação enviada');nav('home')}function acceptTerm(){if(!document.getElementById('agree').checked)return toast('Marque o acordo');db.clients[0].term=true;save();toast('Acordo registrado')}
function render(){let c;if(db.role==='pro')c={dashboard,requests,agenda,clients,commands,finance}[db.page]?.()||dashboard();else c={home,book,documents,payments}[db.page]?.()||home();document.getElementById('root').innerHTML=layout(c)}render();
</script></body></html>
